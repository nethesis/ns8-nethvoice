Listen ${SP_PORT}
# mod_shib must reconstruct external URLs as https on the default port
# (TLS is terminated by Traefik; the container only sees local http).
ServerName ${SP_HOST}:443
UseCanonicalName On
ShibURLScheme https

<VirtualHost *:${SP_PORT}>
    ServerName ${SP_HOST}:443
    UseCanonicalName On
    ShibURLScheme https
    DocumentRoot /var/www/html
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always edit Location "^http://${SP_HOST}(:443)?/" "https://${SP_HOST}/"

    # forwardAuth check endpoint: Remote-User is ALWAYS emitted (empty without
    # a session), so Traefik replaces any client-supplied value.
    Alias /sso-auth /var/www/html/authcheck
    <Location /sso-auth>
        AuthType shibboleth
        ShibRequestSetting requireSession 0
        Require shibboleth
        Header always set Remote-User ""
        Header always set Remote-User "%{${SP_IDENTITY_ATTRIBUTE}}e" env=${SP_IDENTITY_ATTRIBUTE}
    </Location>

    <Directory /var/www/html>
        Require all granted
    </Directory>
</VirtualHost>
