name: PHP checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-checks:
    name: PHP 8.2 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install compatibility tools
        run: composer install --working-dir=tools/php-compatibility --no-interaction --no-progress --prefer-dist

      - name: Install locked REST dependencies
        run: composer install --working-dir=freepbx/var/www/html/freepbx/rest --no-interaction --no-progress --prefer-dist

      - name: Prepare pinned FreePBX test sources
        run: python3 tools/prepare-freepbx-test-sources.py .test-sources

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests/unit -v

      - name: Run PHP checks
        run: |
          container=$(buildah from docker.io/library/php:8.2-cli-alpine)
          trap 'buildah rm "$container"' EXIT
          buildah run \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workingdir /workspace \
            "$container" \
            -- sh tools/check-php.sh
          buildah run \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workingdir /workspace \
            "$container" \
            -- sh tools/test-freepbx.sh /workspace/.test-sources
