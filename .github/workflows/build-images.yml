name: Build and publish images

on:
  workflow_call:
    inputs:
      imagetag:
        description: "The image tag to use when publishing. Defaults to the branch or tag name that triggered the workflow."
        required: false
        type: string
        default: ""
      runner-version:
        description: "The version of the runner"
        required: false
        type: string
        default: "ubuntu-latest"
      build-images:
        description: "Comma-separated image names to build. Builds all images when empty."
        required: false
        type: string
        default: ""
      satellite-image:
        description: "Verified Satellite digest for a module-only build."
        required: false
        type: string
        default: ""
    outputs:
      images:
        description: "Built image names without tags"
        value: ${{ jobs.build-images.outputs.images }}
      satellite-image:
        description: "Published Satellite image pinned by digest"
        value: ${{ jobs.build-images.outputs.satellite-image }}
    secrets:
      netrcb64:
        description: "Netrc Base64-encoded file content for authenticated downloads"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build and publish images
    runs-on: ${{ inputs.runner-version }}
    outputs:
      images: ${{ steps.build.outputs.images }}
      satellite-image: ${{ steps.publish.outputs.satellite-image }}
    env:
      IMAGETAG: ${{ inputs.imagetag }}
      BUILD_IMAGES: ${{ inputs.build-images }}
      SATELLITE_BASE_IMAGE: ${{ inputs.satellite-image }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: actions/cache@v5
        with:
          path: ui/node_modules
          key: "yarn-${{ hashFiles('ui/yarn.lock') }}"

      - name: Select coordinated Satellite source
        id: satellite
        if: inputs.build-images == '' || contains(format(',{0},', inputs.build-images), ',satellite,') || contains(format(',{0},', inputs.build-images), ',nethvoice-satellite,') || inputs.build-images == 'all'
        run: |
          satellite_ref=$(cat satellite/runtime-ref)
          [[ "$satellite_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$satellite_ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Satellite runtime
        if: steps.satellite.outputs.ref != ''
        uses: actions/checkout@v6
        with:
          repository: Nethesis/satellite
          ref: ${{ steps.satellite.outputs.ref }}
          path: .satellite-source

      - name: Configure Satellite build context
        if: steps.satellite.outputs.ref != ''
        run: echo "SATELLITE_SOURCE_DIR=$GITHUB_WORKSPACE/.satellite-source" >> "$GITHUB_ENV"

      - name: Prepare image environment
        run: |
          repository_owner="${GITHUB_REPOSITORY_OWNER,,}"
          imagetag="${IMAGETAG:-${GITHUB_REF_NAME}}"
          imagetag="${imagetag:?}"
          imagetag="${imagetag//\//-}"
          {
            echo "REPOBASE=ghcr.io/${repository_owner}"
            echo "IMAGETAG=${imagetag}"
          } >> "$GITHUB_ENV"

      - name: Log in to container registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: buildah login -u "${GITHUB_ACTOR}" --password-stdin ghcr.io <<<"${REGISTRY_TOKEN}"

      - name: Build module images
        id: build
        env:
          NETRC_B64: ${{ secrets.netrcb64 }}
        run: |
          if [[ -n "${NETRC_B64}" ]]; then
            ( umask 077; base64 -d <<<"${NETRC_B64}" > ~/.netrc )
          fi
          bash build-images.sh

      - name: Publish module images
        id: publish
        run: |
          trap 'buildah logout ghcr.io' EXIT
          images=(${{ steps.build.outputs.images }})
          urls=""
          for image in "${images[@]}" ; do
            buildah push --digestfile image-digest.txt "${image}" "docker://${image}:${IMAGETAG}"
            if [[ "${image}" == */nethvoice-satellite ]]; then
              echo "satellite-image=${image}@$(cat image-digest.txt)" >> "$GITHUB_OUTPUT"
            fi
            if [[ "${IMAGETAG}" == "main" || "${IMAGETAG}" == "master" ]]; then
              buildah push "${image}" "docker://${image}:latest"
            fi
            urls="${image}:${IMAGETAG} "$'\n'"${urls}"
          done
          echo "::notice title=Image URLs::${urls}"
