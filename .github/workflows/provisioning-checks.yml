name: Provisioning checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lldp:
    name: LLDP UI, migration, and templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Run LLDP UI tests
        run: node tests/unit/test_lldp_ui.cjs

      - name: Prepare Tancredi sources
        run: |
          echo "TANCREDI_ROOT=${GITHUB_WORKSPACE}/tancredi/app" >> "$GITHUB_ENV"
          composer install --working-dir=tancredi/app --no-dev --no-interaction --no-progress --prefer-dist

      - name: Run LLDP migration and rendering tests
        run: |
          php tests/unit/test_tancredi_lldp.php
          tancredi_conf="${TANCREDI_ROOT}/tancredi.conf.sample" php "${TANCREDI_ROOT}/test/lldp-rendering.php"
