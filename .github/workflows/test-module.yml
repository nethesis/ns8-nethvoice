name: Test module
run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: false
        default: false
        type: boolean
      fias_tests:
        description: "Run FIAS end-to-end tests"
        required: false
        default: false
        type: boolean
      fias_image:
        description: "Optional already-published module image for the FIAS E2E run"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  run:
    name: "Run tests"
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      ui_tests_strategy: always
      debug_shell: ${{ inputs.debug_shell == true }}

  module:
    name: "Resolve FIAS test image"
    if: inputs.fias_tests
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@v1

  fias-e2e:
    name: "FIAS E2E (${{ matrix.scenario }})"
    needs: module
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: install
            node: debian13
          - scenario: update
            node: rocky9
    uses: NethServer/ns8-github-actions/.github/workflows/test-on-qemu.yml@v1
    with:
      distro: ${{ matrix.node }}
      image_url: ${{ inputs.fias_image || needs.module.outputs.image }}
      install_args: ${{ matrix.scenario == 'install' && (inputs.fias_image || needs.module.outputs.image) || '' }}
      args: ${{ format('-v SCENARIO:{0} -v RUN_FIAS_E2E:true', matrix.scenario) }}
      repo_ref: ${{ needs.module.outputs.sha }}
      version_tag: ${{ needs.module.outputs.tag }}
      script: ""
      artifact_suffix: ${{ format('fias-{0}', matrix.scenario) }}
      status_suffix: fias
      debug_shell: ${{ inputs.debug_shell == true }}
