name: Test module

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: false
        default: false
        type: boolean
      fias_image:
        description: "Optional already-published module image for the E2E run"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  module:
    name: "Resolve test image"
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@v1

  run:
    name: "Run tests (${{ matrix.scenario }})"
    # Run the complete suite once per node: separate ordinary and FIAS jobs
    # collide on both the runner's concurrency key and its artifact names.
    needs: module
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: install
            node: dn1
          - scenario: update
            node: rl1
    uses: NethServer/ns8-github-actions/.github/workflows/test-on-digitalocean-infra.yml@v1
    with:
      coremodules: ${{ matrix.scenario == 'install' && (inputs.fias_image || needs.module.outputs.image) || '' }}
      leader_nodes: ${{ matrix.node }}
      args: ${{ format('{0} -v SCENARIO:{1} -v RUN_FIAS_E2E:true', inputs.fias_image || needs.module.outputs.image, matrix.scenario) }}
      repo_ref: ${{ needs.module.outputs.sha }}
      run_ui_tests: true
      debug_shell: ${{ inputs.debug_shell == true }}
    secrets:
      do_token: ${{ secrets.do_token }}
