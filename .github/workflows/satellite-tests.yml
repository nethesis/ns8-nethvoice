name: Satellite tests

on:
  push:
    paths:
      - satellite/**
      - .github/workflows/satellite-tests.yml
  pull_request:
    paths:
      - satellite/**
      - .github/workflows/satellite-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            satellite/requirements.txt
            satellite/requirements-agent.lock
            satellite/requirements-dev.txt
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, sodium
          coverage: none
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc python3-dev portaudio19-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-agent.lock -r requirements-dev.txt
      - name: Run tests
        run: pytest
