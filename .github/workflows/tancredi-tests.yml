name: Tancredi tests

on:
  push:
    paths:
      - tancredi/app/**
      - .github/workflows/tancredi-tests.yml
  pull_request:
    paths:
      - tancredi/app/**
      - .github/workflows/tancredi-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: tancredi/app
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer validate
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
      - name: Run PHP lint checks
        run: for F in $(find public/ src/ scripts/ -name '*.php'); do php -l $F || exit 1; done
      - name: Run Twig lint checks
        run: >
          export tancredi_conf="tancredi.conf.sample" ;
          find data/ -name '*.tmpl' -or -name '*.macros' |
          php -B 'require_once("vendor/autoload.php"); $errors = 0; $twig = new \Twig\Environment(new \Twig\Loader\FilesystemLoader("data/templates"));'
          -R 'printf("[NOTICE] Checking %s\n",  $argn); try { $twig->tokenize(file_get_contents($argn)); } catch (Exception $ex) { ++$errors ; printf("[ERROR] in %s: %s\n", $argn, $ex->getMessage()); }'
          -E '$errors > 0 ? exit(1) : exit(0);'
      - name: Check .ini files syntax
        run: >
          find data/ -name '*.ini' | php
          -B '$errors = 0; error_reporting(0);'
          -R 'if(parse_ini_file($argn) === FALSE) { ++$errors ; printf("[ERROR] in %s: %s\n", $argn, strtr("message", error_get_last())); } else { printf("[NOTICE] Syntax ok: %s\n", $argn); }'
          -E '$errors > 0 ? exit(1) : exit(0);'

  api:
    name: API tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: tancredi/app
    steps:
      - uses: actions/checkout@v7
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 libapache2-mod-xsendfile bats libapache2-mod-php

      - name: Install Tancredi
        run: |
          composer install --no-dev
          rm -v src/Entity/SampleFilter.php
          sudo mkdir -p /usr/share/tancredi/data/
          sudo cp -a {public,scripts,src,vendor}/ /usr/share/tancredi/
          sudo cp -a data/{backgrounds,firmware,patterns.d,ringtones,scopes,screensavers,templates} /usr/share/tancredi/data/
          sudo mkdir -p /var/lib/tancredi/data/{first_access_tokens,scopes,templates-custom,tokens,backgrounds,firmware,ringtones,screensavers}
          sudo chown -R www-data:www-data /var/lib/tancredi
          sudo tee /etc/tancredi.conf <<'EOF'
          [config]
          rw_dir = "/var/lib/tancredi/data/"
          ro_dir = "/usr/share/tancredi/data/"
          provisioning_url_path = "/provisioning/"
          api_url_path = "/tancredi/api/v1/"
          file_reader = "apache"
          [macvendors]
          00A859 = fanvil
          0C383E = fanvil
          7C2F80 = gigaset
          589EC6 = gigaset
          005058 = sangoma
          000413 = snom
          001565 = yealink
          805E0C = yealink
          805EC0 = yealink
          EOF

      - name: Configure httpd
        run: |
          echo 'Alias /provisioning /usr/share/tancredi/public/provisioning.php' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'Alias /tancredi/api/v1 /usr/share/tancredi/public/api-v1.php' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo '<Directory /usr/share/tancredi/public>' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'Require all granted' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo '</Directory>' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFile on' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFilePath /usr/share/tancredi/data/backgrounds' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFilePath /usr/share/tancredi/data/firmware' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFilePath /usr/share/tancredi/data/ringtones' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFilePath /usr/share/tancredi/data/screensavers' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFilePath /var/lib/tancredi/data/backgrounds' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFilePath /var/lib/tancredi/data/firmware' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFilePath /var/lib/tancredi/data/ringtones' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          echo 'XSendFilePath /var/lib/tancredi/data/screensavers' | sudo tee -a /etc/apache2/sites-available/tancredi.conf
          sudo a2ensite tancredi.conf
          sudo a2dissite 000-default.conf
          sudo systemctl restart apache2

      - name: Run bats
        run: |
          cd test
          sudo ./run.sh system

      - name: Print Apache logs
        if: failure()
        run: |
          sudo cat /var/log/apache2/error.log
          sudo cat /var/log/apache2/access.log

      - name: Upload fixture files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tancredi-fixtures
          path: /tmp/fixtures/*

