name: Service recovery regressions

on:
  pull_request:
  push:
    branches: [fpbx17]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests/unit -v
      - run: bash -n imageroot/bin/restart-services-when-convenient imageroot/update-module.d/80restart
  systemd:
    name: Real systemd dependency ordering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated systemd harness
        run: podman build -t localhost/nethvoice-systemd-test -f tests/systemd/Containerfile tests/systemd
      - name: Exercise real startup and recovery transactions
        run: |
          trap 'podman rm -f nethvoice-systemd-test' EXIT
          podman run -d --name nethvoice-systemd-test --systemd=always --cgroupns=private \
            -v "$GITHUB_WORKSPACE:/workspace:ro" localhost/nethvoice-systemd-test
          timeout 30 sh -c 'until podman exec nethvoice-systemd-test systemctl show-environment >/dev/null 2>&1; do sleep 1; done'
          podman exec -e NETHVOICE_ISOLATED_SYSTEMD_TEST=1 nethvoice-systemd-test \
            python3 /workspace/tests/systemd/test_recovery.py
      - name: Validate production unit syntax
        run: |
          # Supply NS8/Podman executable placeholders only in the disposable
          # container. Validation never executes these unit commands.
          podman run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" localhost/nethvoice-systemd-test sh -ec '
            ln -s /usr/bin/true /usr/local/bin/runagent
            ln -s /usr/bin/true /usr/bin/podman
            systemd-analyze verify /workspace/imageroot/systemd/user/mariadb.service \
              /workspace/imageroot/systemd/user/freepbx.service \
              /workspace/imageroot/systemd/user/reports-api.service \
              /workspace/imageroot/systemd/user/tancredi.service \
              /workspace/imageroot/systemd/user/reports-ui.service
          '
