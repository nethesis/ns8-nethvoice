name: NethVoice UI checks

on:
  pull_request:
    paths:
      - freepbx/nethvoice-ui/**
      - freepbx/var/www/html/freepbx/rest/openapi.yaml
      - mcp/**
      - .github/workflows/nethvoice-ui-checks.yml
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Lint, types, API contract, unit and end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freepbx/nethvoice-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: freepbx/nethvoice-ui/package-lock.json

      - name: Install dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Check translations
        run: node scripts/check-i18n.mjs

      - name: Validate the OpenAPI document
        run: npm run openapi:lint

      - name: Check generated API types are up to date
        run: npm run openapi:check

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build-only

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: freepbx/nethvoice-ui/playwright-report
          retention-days: 7

  mcp:
    name: MCP server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test
