name: Check & deploy NethCTI Middleware API documentation

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - nethcti-middleware/doc/openapi.yaml
  pull_request:
    branches:
      - main
    paths:
      - nethcti-middleware/doc/openapi.yaml
  workflow_dispatch:

jobs:
  deploy-doc:
    if: ${{ github.event_name != 'pull_request' }}
    name: Deploy API documentation on Bump.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy API documentation
        uses: bump-sh/github-action@v1
        with:
          doc: nethcti-middleware
          token: ${{ secrets.BUMP_SH_TOKEN }}
          file: nethcti-middleware/doc/openapi.yaml
  api-diff:
    if: ${{ github.event_name == 'pull_request' }}
    name: Check API diff on Bump.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comment pull request with API diff
        uses: bump-sh/github-action@v1
        with:
          doc: nethcti-middleware
          token: ${{ secrets.BUMP_SH_TOKEN }}
          file: nethcti-middleware/doc/openapi.yaml
          command: diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
