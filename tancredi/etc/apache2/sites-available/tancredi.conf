Alias "/tancredi/api/v1" "/usr/share/tancredi/public/api-v1.php"
Alias "/provisioning" "/usr/share/tancredi/public/provisioning.php"

# Only the four asset upload endpoints need multipart request parsing.
# Reject other multipart requests before PHP executes, including provisioning.
<Directory /usr/share/tancredi/public>
    RewriteEngine On
    RewriteCond %{HTTP:Content-Type} multipart/form-data [NC]
    RewriteCond %{REQUEST_METHOD} !^POST$ [OR]
    RewriteCond %{REQUEST_URI} !^/tancredi/api/v1/(backgrounds|firmware|ringtones|screensavers)$
    RewriteRule ^ - [F,L]
</Directory>

<LocationMatch "/provisioning/[a-zA-Z0-9\.\-_]+$">
    Require ip 127.0.0.1
</LocationMatch>

<Location "/tancredi/api/v1">
    Require ip 127.0.0.1
</Location>

# Restrict XSendFile data directories to prevent path traversal
<Directory /var/lib/tancredi/data>
    Options -Indexes -FollowSymLinks
    AllowOverride None
</Directory>
<Directory /usr/share/tancredi/data>
    Options -Indexes -FollowSymLinks
    AllowOverride None
</Directory>

XSendFile on
XSendFilePath /var/lib/tancredi/data/backgrounds
XSendFilePath /usr/share/tancredi/data/backgrounds
XSendFilePath /var/lib/tancredi/data/firmware
XSendFilePath /usr/share/tancredi/data/firmware
XSendFilePath /var/lib/tancredi/data/ringtones
XSendFilePath /usr/share/tancredi/data/ringtones
XSendFilePath /var/lib/tancredi/data/screensavers
XSendFilePath /usr/share/tancredi/data/screensavers

# Security headers to mitigate confusion attacks
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
