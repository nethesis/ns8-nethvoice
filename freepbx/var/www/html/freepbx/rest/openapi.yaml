openapi: 3.0.3
info:
  title: NethVoice FreePBX REST API
  version: 1.0.0
  description: 'Simple REST API framework for NethVoice based on Slim framework.


    ## Authentication

    Each request must include two HTTP headers:

    - `User`: must be a valid FreePBX administrator (ampusers table) with the `*`
    section or at least one `nethvoice:<section>` section

    - `Secretkey`: must be a valid hash calculated from user + password (SHA1) + shared
    secret


    Authentication endpoints (`/login`, `/logout`, `/testauth`) do not require these
    headers.

    Shared secrets is saved inside the `passwords.env` file, under the `NETHVOICESECRETKEY`
    variable. '
  contact:
    name: Nethesis
    url: https://www.nethesis.it
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: https://{host}/freepbx/rest
  description: NethVoice REST API server
  variables:
    host:
      default: voice.nethserver.org
      description: Your NethVoice server hostname or IP
security:
- FreePBXAuth: []
paths:
  /login:
    get:
      summary: Create a FreePBX admin session cookie.
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlag'
      description: 'Returns `{ "success": true }` after seeding the AMP session as
        the `admin` user.'
      operationId: get_login
      security: []
  /logout:
    get:
      summary: Invalidate the current FreePBX admin session.
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlag'
      description: 'Clears the `AMP_user` session entry and returns `{ "success":
        true }`.'
      operationId: get_logout
      security: []
  /me:
    get:
      summary: Return the authenticated administrator and the sections he can manage.
      description: '`superadmin` grants every section and the endpoints reserved to
        the FreePBX administrator. Requests to a section the administrator cannot
        manage are rejected with 403 and `{ "message": "Forbidden: missing permission"
        }`.'
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAdmin'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get_me
  /testauth:
    post:
      summary: Validate FreePBX credentials and disclose the shared secret.
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAuthResponse'
        '401':
          description: Invalid credentials
      description: 'Body: `{ "username": "", "password": "" }`. On success returns
        `{ "result": "<secret>" }` with status 200; otherwise 401. The FreePBX session
        (`AMP_user`) stays open only for superadmin: for administrators who are not
        superadmin it is cleared after the credentials are checked.'
      operationId: post_testauth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAuthRequest'
  /contexts:
    get:
      summary: List dialplan contexts available for assignment.
      tags:
      - Bulk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                from-internal: Standard
                cti-profile-3: CTI Profile Advanced
      description: Returns a JSON object keyed by context name with a human description.
      operationId: get_contexts
  /bulk/{mainextensions}:
    get:
      summary: Inspect common settings across a set of main extensions.
      tags:
      - Bulk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Segment expects a comma separated extension list. Returns only
        values that are identical across the group; divergent keys are `null`.
      operationId: get_bulk_mainextensions
      parameters:
      - name: mainextensions
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Apply the same settings to a comma separated list of main extensions.
      tags:
      - Bulk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersBulkResult'
        '400':
          description: '`Invalid request body`; for administrators who are not superadmin
            also `Invalid ring time` (not digits only or greater than 120) and `Invalid
            control character` (a value contains C0 control characters or DEL)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersBulkResult'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersBulkResult'
      description: 'Body: JSON object with keys such as `displayname`, `callwaiting`,
        `outboundcid_*`, etc. Triggers `retrieveHelper.sh` on success.'
      operationId: post_bulk_mainextensions
      parameters:
      - name: mainextensions
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersBulkRequest'
  /destinations:
    get:
      summary: Enumerate FreePBX destinations for call routing.
      tags:
      - Bulk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                Announcements:
                  '99999':
                    destination: popover
                    description: Add new Announcements &#133
                    category: announcement
                    selected: false
                Callback:
                  '99999':
                    destination: popover
                    description: Add new Callback &#133
                    category: callback
                    selected: false
      description: Wraps the FreePBX destination helper and returns raw data for UI
        selection.
      operationId: get_destinations
  /codecs/voip:
    get:
      summary: Return the ordered list of VoIP trunk codecs.
      tags:
      - Codecs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrunkCodec'
      description: 'Currently returns alaw, ulaw and g729 with `enabled: true`.'
      operationId: get_codecs_voip
  /configuration/userprovider:
    get:
      summary: Report the configured directory provider.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                configured: 1
                type: ldap
      description: Derives the LDAP domain from `NETHVOICE_LDAP_BASE` and reports
        the provider as configured.
      operationId: get_configuration_userprovider
  /configuration/mode:
    get:
      summary: Indicate whether the system is in legacy or UC mode.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                result: unknown
      description: Evaluates the `LegacyMode` prop and presence of `nethserver-directory`
        to return `legacy`, `uc` or `unknown`.
      operationId: get_configuration_mode
  /configuration/networks:
    get:
      summary: Expose host local network metadata from the environment.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/HostNetwork'
      description: Returns the decoded `NETHVOICE_HOST_LOCAL_NETWORKS` value or an
        empty array.
      operationId: get_configuration_networks
  /configuration/wizard:
    get:
      summary: Read the installation wizard progress state.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  $ref: '#/components/schemas/WizardState'
        '500':
          description: Internal server error
      description: Returns the rows in `rest_wizard`, providing the last completed
        step and status.
      operationId: get_configuration_wizard
    post:
      summary: Persist the current wizard step and optionally trigger service restarts.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      description: 'Body: `{ "step": <int>, "status": <bool> }`. Saving step 13 with
        status false completes the wizard, restarts Asterisk and signals the CTI services
        to restart; other steps and statuses never restart services.'
      operationId: post_configuration_wizard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardStateRequest'
  /configuration/externalip:
    get:
      summary: Return the SIP external IP configured in FreePBX.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: 127.0.0.1
      operationId: get_configuration_externalip
  /configuration/externalip/{ip}:
    post:
      summary: Update the SIP external IP and queue a dialplan reload.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Path parameter `ip` must be a valid IPv4 address. Invokes `retrieveHelper.sh`
        on success.
      operationId: post_configuration_externalip_ip
      parameters:
      - name: ip
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /configuration/suggestedip:
    get:
      summary: Discover the public IP as seen from ifconfig.io.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: 146.190.28.17
      description: Returns the IP string on success or HTTP 500 on lookup failure.
      operationId: get_configuration_suggestedip
  /configuration/allowexternalsips:
    get:
      summary: Legacy stub that always reports external SIP access as enabled.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: enabled
      description: Endpoint kept for backward compatibility; always returns the string
        `"enabled"`.
      operationId: get_configuration_allowexternalsips
  /configuration/allowexternalsips/{status}:
    post:
      summary: Legacy stub used by historical UIs to toggle external SIP access.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Currently a no-op that still returns HTTP 200. Accepts only `enabled`
        or `disabled` in the path.
      operationId: post_configuration_allowexternalsips_status
      parameters:
      - name: status
        in: path
        required: true
        schema:
          type: string
          enum:
          - enabled
          - disabled
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /configuration/localnetworks:
    get:
      summary: Retrieve the SIP local network list from FreePBX.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: false
      operationId: get_configuration_localnetworks
    post:
      summary: Request an Asterisk restart after out-of-band local network changes.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Does not accept a body; it simply issues `core restart when convenient`
        through AMI.
      operationId: post_configuration_localnetworks
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /cti/profiles:
    get:
      summary: List CTI permission profiles with macro permissions attached.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CtiProfile'
        '500':
          description: Internal server error
      operationId: get_cti_profiles
    post:
      summary: Create a new CTI profile.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiProfileCreated'
        '409':
          description: Another profile already has this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Empty name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
      description: Body mirrors the profile schema used by the UI. Response returns
        the generated profile id, or 409 when the name is already used.
      operationId: post_cti_profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiProfileRequest'
  /cti/profiles/{id}:
    get:
      summary: Retrieve a single CTI profile by identifier.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiProfile'
        '500':
          description: Internal server error
      operationId: get_cti_profiles_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Update an existing CTI profile definition.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another profile already has this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Empty name, or a rename from or to the reserved Hotel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Another profile update is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
      description: 'Body: serialized profile as produced by the UI; renames the profile,
        updates macro permissions and triggers a dialplan reload.'
      operationId: post_cti_profiles_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiProfileRequest'
    delete:
      summary: Delete a CTI profile and clean up related permissions.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '500':
          description: Internal server error
      operationId: delete_cti_profiles_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/permissions:
    get:
      summary: Enumerate all available CTI permissions grouped by macro category.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                settings:
                  value: false
                  permissions:
                  - id: '2'
                    name: dnd
                    displayname: DND
                    description: Configure do Not Disturb
                    value: false
                  - id: '3'
                    name: call_forward
                    displayname: Call Forward
                    description: Configure Call Forward
                    value: false
                  - id: '4'
                    name: recording
                    displayname: Recording
                    description: Record own conversations. View/listen/delete own
                      recording
                    value: false
                  - id: '5'
                    name: conference
                    displayname: Conference
                    description: Make a conference call
                    value: false
                  - id: '6'
                    name: parkings
                    displayname: Parkings
                    description: View parkings state and pickup parked calls
                    value: false
                  - id: '15'
                    name: spy
                    displayname: Spy
                    description: Hear other extensions calls
                    value: false
                  - id: '16'
                    name: intrude
                    displayname: Intrude
                    description: Intrude in calls
                    value: false
                  - id: '18'
                    name: pickup
                    displayname: Pickup
                    description: Pick-up any call
                    value: false
                phonebook:
                  value: false
                  permissions:
                  - id: '12'
                    name: ad_phonebook
                    displayname: Advanced Phonebook
                    description: Modify and delete all contacts
                    value: false
      operationId: get_cti_permissions
  /cti/profiles/users/{user_id}:
    get:
      summary: Return the CTI profile currently assigned to a given user id.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      operationId: get_cti_profiles_users_user_id
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Assign a CTI profile to a user.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '500':
          description: Internal server error
      description: 'Body: `{ "profile_id": <int> }`. Replaces any previous association.'
      operationId: post_cti_profiles_users_user_id
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiUserProfileRequest'
  /cti/groups:
    get:
      summary: List the CTI presence groups.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CtiGroup'
        '500':
          description: Internal server error
      operationId: get_cti_groups
    post:
      summary: Create a CTI presence group and its presence panel permission.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Id of the group.
                oneOf:
                - type: integer
                - type: string
        '500':
          description: Internal server error
      description: 'Body: `{ "name": "<group name>" }`. Returns the created group
        id.'
      operationId: post_cti_groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiGroupCreateRequest'
  /cti/groups/users/{id}:
    get:
      summary: Return the ids of the groups of a user.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        '500':
          description: Internal server error
      operationId: get_cti_groups_users_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Replace the groups assigned to a user.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      description: 'Body: `{ "groups": [<ids>] }`. Existing links are cleared before
        inserting the new list.'
      operationId: post_cti_groups_users_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiUserGroupsRequest'
  /cti/users/groups/{id}:
    get:
      summary: List the users of a CTI group.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CtiGroupMember'
        '500':
          description: Internal server error
      operationId: get_cti_users_groups_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/groups/{id}:
    delete:
      summary: Remove a CTI group and its dynamic permission artifacts.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '500':
          description: Internal server error
      operationId: delete_cti_groups_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/dbconn:
    post:
      summary: Create a database connection.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
        '400': &id004
          description: 'Bad request: invalid parameters'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403': &id001
          description: 'Forbidden: missing permission'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      description: Body includes host, port, type, credentials and database name;
        credentials are stored for later use by customer cards. For administrators
        who are not superadmin, a body that is not a JSON or form object returns 400,
        and a connection to the built-in NethVoice databases returns 403. Built-in
        means connection 1 or 2 on a local host, or any connection to a local host
        (empty, localhost, loopback, link-local or unspecified address, or an address
        of the PBX node) without a
        port or on the port of connection 1 or 2.
      operationId: post_cti_dbconn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsDbConnectionInput'
    get:
      summary: List the database connections used by customer cards.
      description: The password is never returned to administrators who are not
        superadmin; `has_password` tells whether one is stored.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationsDbConnection'
        '500':
          description: Internal server error
      operationId: get_cti_dbconn
  /cti/paramurl/{id}:
    put:
      summary: Update the URL and the profiles of a parameterized URL.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '500':
          description: Internal server error
      description: 'Body: `{ "url": "...", "profiles": [ids], "only_queues": <bool>
        }`. Synchronizes the profile list for the URL.'
      operationId: put_cti_paramurl_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsParamUrlInput'
  /cti/dbconn/{id}:
    put:
      summary: Update the given fields of a database connection.
      description: Reloads nethcti-server so the customer cards use the new parameters.
        An empty or omitted `pass` keeps the stored password, unless `host`, `port`
        or `type` change, which requires the password again. For administrators who
        are not superadmin, a non-numeric `id` or a body that is not a JSON or form
        object returns 400, and 403 is returned when the stored connection or the
        result of the update is a built-in NethVoice database (see `POST /cti/dbconn`).
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request, invalid parameters, or the password is missing
            for a different server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
        '403': *id001
      operationId: put_cti_dbconn_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsDbConnectionInput'
    delete:
      summary: Delete a database connection.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: boolean
        '500':
          description: Internal server error
      operationId: delete_cti_dbconn_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/paramurl:
    post:
      summary: Bind a parameterized URL to CTI profiles (a profile can have one URL
        only).
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      operationId: post_cti_paramurl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsParamUrlInput'
  /cti/paramurl/delete:
    post:
      summary: Unbind a parameterized URL from the given profiles.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      operationId: post_cti_paramurl_delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsParamUrlDeleteInput'
  /cti/dbconn/test:
    post:
      summary: Test a database connection through nethcti-server.
      description: With `id` and an empty `pass`, the stored password of that connection
        is used, only when `host`, `port` and `type` are the stored ones.
      tags:
      - CTI
      responses:
        '200':
          description: Test completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsDbConnectionTestResult'
        '400':
          description: Bad request, or the password is missing for a different server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database connection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
        '502':
          description: nethcti-server is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_cti_dbconn_test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsDbConnectionTestInput'
  /cti/dbconn/type:
    get:
      summary: List the supported database types.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsDbConnectionTypes'
        '500':
          description: Internal server error
      operationId: get_cti_dbconn_type
  /cti/customer_card/template:
    get:
      summary: List the customer card templates.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationsCardTemplate'
        '500':
          description: Internal server error
      operationId: get_cti_customer_card_template
    post:
      summary: Create a customer card template.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
        '403': *id001
      description: 'Body contains `name`, `custom` flag and base64 `html` content.
        Requires the superadmin permission: templates are rendered by the CTI server.'
      operationId: post_cti_customer_card_template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsCardTemplateInput'
  /cti/customer_card/template/{name}:
    put:
      summary: Overwrite a customer card template (the file is found by `name` and
        `custom` in the body).
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
        '500':
          description: Internal server error
        '403': *id001
      operationId: put_cti_customer_card_template_name
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsCardTemplateInput'
      description: 'Requires the superadmin permission: templates are rendered by
        the CTI server.'
    delete:
      summary: Delete a customer card template.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
        '403': *id001
      description: 'Requires the superadmin permission: templates are rendered by
        the CTI server.'
      operationId: delete_cti_customer_card_template_name
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
  /cti/customer_card:
    get:
      summary: List the customer cards.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationsCustomerCard'
        '500':
          description: Internal server error
        '400': *id004
      description: Every query parameter filters the cards by the column with the
        same name. Administrators who are not superadmin can filter only by `id`,
        `name`, `dbconn_id` and `template`; any other parameter returns 400.
      operationId: get_cti_customer_card
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: dbconn_id
        in: query
        required: false
        schema:
          type: string
      - name: template
        in: query
        required: false
        schema:
          type: string
    post:
      summary: Create a customer card.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
        '400': *id004
        '403': *id001
      description: Body includes name, Base64 encoded query, template name, DB connection
        id and profile ids. Generates a permission entry automatically. For administrators
        who are not superadmin, a missing or non-numeric `dbconn_id` returns 400 and
        a card on a built-in NethVoice database (see `POST /cti/dbconn`) returns 403.
      operationId: post_cti_customer_card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsCustomerCardInput'
  /cti/customer_card/{id}:
    put:
      summary: Update a customer card.
      description: When the name changes, the related CTI permission is renamed too
        (name cc_<sanitized name>, displayname <name>). For administrators who are
        not superadmin, 400 is returned for a non-numeric `id`, an empty body, a key
        other than `name`, `query`, `template`, `dbconn_id` and `profiles`, a value
        of those fields that is not a scalar (an array for `profiles`) or a non-numeric
        `dbconn_id`. Changing the query or the connection of a card that ends up on
        a built-in NethVoice database (see `POST /cti/dbconn`) returns 403.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
        '500':
          description: Internal server error
        '400': *id004
        '403': *id001
      operationId: put_cti_customer_card_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsCustomerCardInput'
    delete:
      summary: Delete a customer card.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      operationId: delete_cti_customer_card_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/streaming:
    get:
      summary: List the video sources with their gates and profile bindings.
      description: Passwords are write-only and never returned; `has_secret`
        and `has_password` tell whether one is stored.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VideoSource'
        '500':
          description: Internal server error
      operationId: get_cti_streaming
    post:
      summary: Create a video source, its CTI permission and its gates.
      description: The type follows the URL scheme (`http(s)` image polled by
        the CTI, `rtsp(s)` stream served by the video gateway). Credentials
        pasted into the URL are stored separately. Without `gates`, the legacy
        `open` code creates a first DTMF gate named "Door 1". With
        `door_phone` (the MAC of a door phone prepared by
        `POST /cti/streaming/doorphones/{mac}`), no `secret` and the door phone
        user name, the RTSP password generated for the door phone is used.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSourceError'
        '409':
          description: A source with the same name, or a name that maps to the
            same permission, already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSourceError'
        '500':
          description: Internal server error
      operationId: post_cti_streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoSourceInput'
  /cti/streaming/doorphones:
    get:
      summary: List the provisioned door phones that can become a video source.
      description: Devices of the inventory assigned to an extension whose
        Tancredi model has `cap_door_phone`. `ip` comes from the SIP
        registration of the extension (null when not registered), `url` is the
        suggested RTSP URL, `sources` the sources that already use the
        extension. Secrets are never returned.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    mac:
                      type: string
                      example: 0C-38-3E-32-6B-84
                    model:
                      type: string
                      example: fanvil-i62
                    model_name:
                      type: string
                    extension:
                      type: string
                    name:
                      type: string
                    ip:
                      type: string
                      nullable: true
                    registered:
                      type: boolean
                    url:
                      type: string
                    user:
                      type: string
                    has_secret:
                      type: boolean
                    dtmf_code:
                      type: string
                      nullable: true
                    dtmf_code_2:
                      type: string
                      nullable: true
                      description: DTMF code of the second relay
                    max_gates:
                      type: integer
                      nullable: true
                      description: Most gates a source of this door phone can
                        have (one per relay), null when the model does not
                        declare its relays
                    door_gates:
                      type: array
                      description: The relays of the door phone, the gate N
                        of a source opens the relay N. code is the DTMF code
                        that opens it during a call; url and user, when the
                        model knows them and the device address is known, the
                        http URL that opens it and its web user
                      items:
                        type: object
                        properties:
                          relay:
                            type: integer
                          code:
                            type: string
                            nullable: true
                          url:
                            type: string
                            nullable: true
                          user:
                            type: string
                            nullable: true
                    streams:
                      type: object
                      description: RTSP paths of the main (high quality,
                        default) and sub (slow connections) streams, with the
                        resolution labels of the model
                      properties:
                        main:
                          type: string
                          nullable: true
                        sub:
                          type: string
                          nullable: true
                        main_label:
                          type: string
                        sub_label:
                          type: string
                    sources:
                      type: array
                      items:
                        type: string
        '500':
          description: Internal server error
      operationId: get_cti_streaming_doorphones
  /cti/streaming/doorphones/{mac}:
    post:
      summary: Prepare a video source for a door phone.
      description: Generate the RTSP password (and user name) of the door phone
        when it has none, store them as Tancredi phone variables written on the
        device by its provisioning, ask the device to update its configuration
        and return the form prefill. The password is not returned.
      tags:
      - CTI
      parameters:
      - name: mac
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Form prefill
          content:
            application/json:
              schema:
                type: object
                properties:
                  descr:
                    type: string
                  exten:
                    type: string
                  url:
                    type: string
                  user:
                    type: string
                  has_secret:
                    type: boolean
                  door_phone:
                    type: string
                  streams:
                    type: object
                    description: Same as in GET /cti/streaming/doorphones
                  gates:
                    type: array
                    items:
                      type: object
                  door_gates:
                    type: array
                    description: Same as in GET /cti/streaming/doorphones
                    items:
                      type: object
                  max_gates:
                    type: integer
                    nullable: true
                    description: Same as in GET /cti/streaming/doorphones
                  ip:
                    type: string
                    nullable: true
                  registered:
                    type: boolean
                  credentials_generated:
                    type: boolean
        '400':
          description: Invalid MAC address
        '404':
          description: Not a door phone assigned to an extension
        '500':
          description: Internal server error
      operationId: post_cti_streaming_doorphones_mac
  /cti/streaming/doorphones/{mac}/sync:
    post:
      summary: Give the sources linked to a door phone its current password.
      description: Called by the wizard after the settings of a door phone are
        saved. Applies the configuration when a source changed.
      tags:
      - CTI
      parameters:
      - name: mac
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Number of updated sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        '400':
          description: Invalid MAC address
        '500':
          description: Internal server error
      operationId: post_cti_streaming_doorphones_mac_sync
  /cti/streaming/reachability:
    post:
      summary: Check whether the PBX reaches the device of a source URL.
      description: Opens a TCP connection to the host and port of a rtsp,
        rtsps, http or https URL (default ports 554, 322, 80, 443; 2
        seconds), nothing is sent to the device. `private` tells that the
        address belongs to a private network. With `door_phone`, when the
        device is not reachable, the public address the door phone registers
        from is returned in `public_address` and `public_url` if the PBX
        reaches it on the same port.
      tags:
      - CTI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                door_phone:
                  type: string
      responses:
        '200':
          description: Reachability
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    type: string
                  port:
                    type: integer
                  private:
                    type: boolean
                  reachable:
                    type: boolean
                  public_address:
                    type: string
                    nullable: true
                  public_url:
                    type: string
                    nullable: true
        '400':
          description: Not a source URL or invalid door phone
        '500':
          description: Internal server error
      operationId: post_cti_streaming_reachability
  /cti/paramurls:
    get:
      summary: List the parameterized URLs, one row per URL.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationsParamUrl'
        '500':
          description: Internal server error
      operationId: get_cti_paramurls
  /cti/streaming/{descr}:
    put:
      summary: Update a video source, its gates and its profile assignments.
      description: '`currentDescr` (or the path parameter) is the current name.
        An empty or missing `secret` keeps the stored password, an empty `user`
        removes the credentials; the same applies to `password` and `username`
        of a URL gate identified by its `id`. Without `gates`, the legacy `open`
        code replaces the code of the first DTMF gate.'
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSourceError'
        '404':
          description: Source not found
        '409':
          description: The new name is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSourceError'
        '500':
          description: Internal server error
      operationId: put_cti_streaming_descr
      parameters:
      - name: descr
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/VideoSourceInput'
              - type: object
                properties:
                  currentDescr:
                    type: string
  /cti/sources/test:
    post:
      summary: Check a video source and grab a preview frame.
      description: 'RTSP(S) sources are probed with ffprobe (codecs, resolution)
        and one JPEG frame is grabbed with ffmpeg, always over TCP, directly
        from the device. HTTP(S) sources are fetched with the given
        credentials. With `descr` of a stored source and an empty `secret`,
        the stored password is used, only for the same scheme, host and port.
        TLS certificates of https:// and rtsps:// devices are verified (system
        CA store and host name) unless `tls_skip_verify`; an untrusted
        certificate fails with reason `tls_error`. Without `tls_skip_verify`,
        the value stored for `descr` is used (same scheme, host and port).
        RTSP sources, or `details: true`, answer with a `VideoSourceCheck`
        object (HTTP 200 also on failure); legacy clients (HTTP URL without
        `details`) get the Base64 image as a JSON string, or HTTP 500.'
      tags:
      - CTI
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/VideoSourceCheck'
                - type: string
                  description: Legacy Base64 image
        '400':
          description: Invalid URL
        '500':
          description: Internal server error
      operationId: post_cti_sources_test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  example: rtsp://192.0.2.10:554/stream1
                user:
                  type: string
                secret:
                  type: string
                descr:
                  type: string
                  description: Name of a stored source whose password is used
                    when `secret` is empty
                tls_skip_verify:
                  type: boolean
                  description: Do not verify the TLS certificate of the device
                    (self-signed certificates)
                details:
                  type: boolean
                  description: Return a VideoSourceCheck also for HTTP sources
  /cti/sources/gateway:
    get:
      summary: Network facts of the video gateway for the administrator.
      description: '`public_ip` is the address the devices see the PBX coming
        from: the port-forward of a RTSP device should allow only it.'
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_ip:
                    type: string
                    nullable: true
                  ice_hosts:
                    type: array
                    items:
                      type: string
                  ice_udp_port:
                    type: integer
                    nullable: true
                  ice_tcp_port:
                    type: integer
                    nullable: true
                  path_prefix:
                    type: string
                    example: /streaming-gw/
        '500':
          description: Internal server error
      operationId: get_cti_sources_gateway
  /cti/streaming/{name}:
    delete:
      summary: Delete a streaming source and related permission record.
      description: The source must exist with exactly this name.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No source with exactly this name
        '500':
          description: Internal server error
      operationId: delete_cti_streaming_name
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
  /devices/scan:
    post:
      summary: Placeholder for network scan trigger (not yet implemented).
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Currently returns HTTP 500 and is kept only for compatibility with
        older clients.
      operationId: post_devices_scan
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /devices/{mac}/brand:
    get:
      summary: Resolve the vendor brand for a given MAC address.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: null
      operationId: get_devices_mac_brand
      parameters:
      - name: mac
        in: path
        required: true
        schema:
          type: string
  /devices/gateways/list/{id}:
    get:
      summary: List the configured gateways. The `id` path parameter is ignored.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatewayConfig'
        '500':
          description: Internal server error
      operationId: get_devices_gateways_list_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /devices/phones/list:
    get:
      summary: Return the consolidated phone inventory, combining scans and configured
        devices.
      description: The `secret`, `web_user` and `web_password` fields of the lines
        are returned only to the superadmin.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: []
      operationId: get_devices_phones_list
  /devices/gateways/list:
    get:
      summary: Return the union of all scanned gateway entries across networks.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: []
      operationId: get_devices_gateways_list
  /devices/phones/manufacturers:
    get:
      summary: Expose the provisioning models supported by Endpoint Manager grouped
        by brand.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                Aastra:
                - 9112i
                - 9133i
                Alcatel Temporis:
                - IP150
      operationId: get_devices_phones_manufacturers
  /devices/gateways/manufacturers:
    get:
      summary: List supported gateway models enriched with proxy defaults.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Gateway models grouped by manufacturer
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/GatewayModel'
      operationId: get_devices_gateways_manufacturers
  /devices/phones/reload/{extension}:
    post:
      summary: Send a PJSIP notify to force a phone to reload its configuration.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Only available when the provisioning engine is Tancredi; returns
        202 on success, 403 when the phone is not provisioned.
      operationId: post_devices_phones_reload_extension
      parameters:
      - name: extension
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /devices/phones/model:
    post:
      summary: Bind a scanned MAC address to a specific vendor and model.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: 'Body: `{ "mac": "", "vendor": "", "model": "" }`. Inserts or replaces
        the association.'
      operationId: post_devices_phones_model
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /devices/gateways:
    post:
      summary: Create or update a gateway configuration and related trunks.
      description: Trunks and FXS extensions are created first and the gateway configuration
        is written in one transaction at the end. When any step fails, the trunks
        and extensions created by the request are removed and an existing configuration
        with the same name and MAC address is kept. Cleanup failures are listed in
        `warnings`.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySaveResult'
        '400':
          description: Bad request; for administrators who are not superadmin also
            `Invalid control character` (a value contains C0 control characters or DEL),
            `Invalid gateway MAC address` and `Invalid linked extension` in `errors`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySaveResult'
        '409':
          description: Another gateway already uses this MAC address. Nothing is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySaveResult'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySaveResult'
      operationId: post_devices_gateways
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewaySaveRequest'
  /devices/gateways/push:
    post:
      summary: Generate configuration files for a gateway and push them via TFTP helper.
      tags:
