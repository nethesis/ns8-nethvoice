        manufacturer:
          type: string
        mac:
          type: string
          example: 00:A0:BA:0B:1C:DD
        ipv4:
          type: string
        ipv4_new:
          type: string
          description: IP address of the device
          example: 192.168.1.20
        netmask_green:
          type: string
          example: 255.255.255.0
        gateway:
          type: string
          example: 192.168.1.1
        ipv4_green:
          type: string
          description: PBX address
        proxy:
          type: string
        trunks_isdn:
          type: array
          items:
            $ref: '#/components/schemas/GatewayIsdnPort'
        trunks_pri:
          type: array
          items:
            $ref: '#/components/schemas/GatewayPriPort'
        trunks_fxo:
          type: array
          items:
            $ref: '#/components/schemas/GatewayFxoPort'
        trunks_fxs:
          type: array
          items:
            $ref: '#/components/schemas/GatewayFxsPort'
    GatewaySaveResult:
