        trunks_pri:
          type: array
          items:
            $ref: '#/components/schemas/GatewayPriPort'
        trunks_fxo:
          type: array
          items:
            $ref: '#/components/schemas/GatewayFxoPort'
        trunks_fxs:
          type: array
          items:
            $ref: '#/components/schemas/GatewayFxsPort'
    GatewaySaveRequest:
      type: object
