          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhonesPhysicalExtensionResponse'
        '400':
          description: 'For administrators who are not superadmin, `Invalid MAC address`
            (not 12 hexadecimal digits) or `Invalid extension` (`mainextension` not made
            of digits only)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhonesStatusError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhonesStatusError'
      description: Body supports keys like `mainextension`, `mac`, `model`, `line`,
        `web_user`, `web_password` and `clear_temporary`.
      operationId: post_physicalextensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhonesPhysicalExtensionRequest'
  /physicalextensions/{extension}:
    get:
      summary: Return details for a specific physical extension.
