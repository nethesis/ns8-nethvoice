        required: true
        schema:
          type: string
components:
  securitySchemes:
    FreePBXAuth:
      type: apiKey
      in: header
      name: User
      description: 'FreePBX authentication requires two headers:

        - `User`: FreePBX administrator username

        - `Secretkey`: SHA1 hash of (user + SHA1(password) + secret)'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    LegacyError:
      type: object
      description: Error body returned by the legacy handlers.
      properties:
        error:
          type: string
    TestAuthRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TestAuthResponse:
      type: object
      required:
      - result
      properties:
        result:
          type: string
          description: Shared secret used to compute the Secretkey header.
    SuccessFlag:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
    WizardState:
      type: object
      required:
      - step
      - status
      properties:
        step:
          oneOf:
          - type: integer
          - type: string
          description: Wizard step reached. 13 is the final step.
        status:
          type: string
          nullable: true
          description: '"true" while the wizard is in progress, "false" once completed.'
    WizardStateRequest:
      type: object
      required:
      - step
      - status
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 13
          description: Saving step 13 restarts Asterisk, nethcti-server and nethcti-middleware.
        status:
          type: string
          enum:
          - 'true'
          - 'false'
    PbxLanguages:
      type: object
      description: Installed PBX languages, keyed by language code.
      additionalProperties:
        type: object
        required:
        - default
        properties:
          default:
            type: boolean
    DefaultLanguageRequest:
      type: object
      required:
      - lang
      properties:
        lang:
          type: string
          description: Language code, as returned by GET /settings/languages.
    TrunkDetails:
      type: object
      description: Technology parameters of the trunk (`pjsip` table for PJSIP trunks).
        Every value is a string. Credentials (`secret`, `md5_cred` and every `auth_*`
        keyword) are never returned.
      properties:
        codecs:
          type: string
          description: Comma separated list of allowed codecs
          example: alaw,ulaw
        sip_server:
          type: string
        sip_server_port:
          type: string
        username:
          type: string
        registration:
          type: string
          example: send
        authentication:
          type: string
          example: outbound
      additionalProperties:
        type: string
        nullable: true
    Trunk:
      type: object
      required:
      - trunkid
      - tech
      - name
      properties:
        trunkid:
          type: integer
        tech:
          type: string
          example: pjsip
        channelid:
          type: string
        name:
          type: string
        outcid:
          type: string
          description: Phone number of the trunk (outbound caller ID)
        keepcid:
          type: string
        maxchans:
          type: string
        failscript:
          type: string
        dialoutprefix:
          type: string
        usercontext:
          type: string
        provider:
          type: string
          description: Provider identifier, as given to `POST /trunks`; empty for
            trunks created outside the wizard.
        disabled:
          type: string
          enum:
          - 'on'
          - 'off'
        continue:
          type: string
        routedisplay:
          type: string
        dialopts:
          oneOf:
          - type: boolean
          - type: string
        username:
          type: string
          nullable: true
        details:
          $ref: '#/components/schemas/TrunkDetails'
    TrunkCreateRequest:
      type: object
      required:
      - provider
      - username
      - password
      - phone
      - codecs
      - forceCodec
      properties:
        provider:
          type: string
          description: Provider identifier from `GET /providers`
          example: twt
        name:
          type: string
          maxLength: 50
          description: Trunk name. It becomes the PJSIP endpoint name. Defaults to
            the provider identifier.
          example: main_trunk
        username:
          type: string
        password:
          type: string
        phone:
          type: string
          example: '0721405516'
        codecs:
          type: array
          items:
            type: string
          description: Preferred codecs. An empty list keeps the provider defaults.
        forceCodec:
          type: boolean
          description: When true only `codecs` are allowed. When false they are merged
            with the provider defaults.
    TrunkUpdateRequest:
      type: object
      description: Only the fields that are present are changed.
      properties:
        username:
          type: string
        password:
          type: string
          description: New SIP secret. An empty or blank string keeps the current
            secret.
        phone:
          type: string
        codecs:
          type: array
          items:
            type: string
        forceCodec:
          type: boolean
    TrunkProvider:
      type: object
      required:
      - id
      - provider
      - description
      properties:
        id:
          type: integer
        provider:
          type: string
          example: twt
        description:
          type: string
          example: TWT
        codecs:
          type: string
          nullable: true
          description: Comma separated default codecs of the provider
          example: ulaw,alaw,g729
    TrunkCodec:
      type: object
      required:
      - codec
      - enabled
      properties:
        codec:
          type: string
          example: alaw
        enabled:
          type: boolean
    GatewayModel:
      type: object
      required:
      - id
      - model
      - manufacturer
      - description
      properties:
        id:
          type: integer
        model:
          type: string
          example: TRI_ISDN_2
        manufacturer:
          type: string
          example: Patton
        tech:
          type: string
          example: isdn
        n_pri_trunks:
          type: integer
        n_isdn_trunks:
          type: integer
        n_fxo_trunks:
          type: integer
        n_fxs_ext:
          type: integer
        description:
          type: string
          example: TRINITY ISDN 2 Porte
        proxy:
          type: string
          example: sip:10.5.4.1:5060;lr
        ipv4_green:
          type: string
          description: Default PBX address (`NETHVOICE_HOST`)
          example: voice.example.org
    GatewayIsdnPort:
