      operationId: delete_physicalextensions_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /physicalextensions/adminpw:
    post:
      summary: Set the web UI admin credentials for all provisioned phones.
      tags:
      - Physicalextensions
      responses:
        '200':
          description: Successful response
      operationId: post_physicalextensions_adminpw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhonesAdminPasswordRequest'
  /physicalextensions/{mac}:
    patch:
      summary: Update the stored model for a provisioned MAC address (`AA-BB-CC-DD-EE-FF`).
