            user synchronization failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountResult'
        '400':
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '403':
          description: Missing permission, or `protected_account`, `own_account`
            or `domain_admin`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '404':
          description: '`user_not_found`: the account does not exist in the user domain'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '409':
          description: The user domain is external and cannot be managed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '502':
          description: The user domain answered with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '503':
          description: The user domain is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
      operationId: delete_users_username_account
