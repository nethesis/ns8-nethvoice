            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '404':
          description: '`user_not_found`: the account does not exist in the user domain'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '409':
          description: The user domain is external and cannot be managed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '422':
          description: '`invalid_mail` or `invalid_display_name` (the display name
