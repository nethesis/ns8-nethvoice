      operationId: get_voicemails
    post:
      summary: Enable or disable the voicemail box of an extension.
      tags:
      - Voicemails
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersStatusMessage'
        '500':
          description: Internal server error
      operationId: post_voicemails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersVoicemailRequest'
  /voicemails/{extension}:
    get:
      summary: Return the voicemail configuration for a specific extension.
      tags:
      - Voicemails
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  pwd:
                    type: string
                    description: Voicemail PIN, returned only to superadmin.
      description: The `pwd` of the box is returned only to superadmin.
      operationId: get_voicemails_extension
      parameters:
      - name: extension
        in: path
        required: true
        schema:
          type: string
  /webrtc/{mainextension}:
    get:
      summary: Return the WebRTC extension linked to the given main extension.
      tags:
      - Webrtc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: null
      operationId: get_webrtc_mainextension
      parameters:
      - name: mainextension
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Disable the Web phone of a user.
      tags:
      - Webrtc
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      operationId: delete_webrtc_mainextension
      parameters:
      - name: mainextension
        in: path
        required: true
        schema:
          type: string
  /webrtc:
    post:
      summary: Enable the Web phone (WebRTC extension) of a user.
      tags:
      - Webrtc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersDeviceExtension'
        '400':
          description: 'For administrators who are not superadmin, `Invalid extension`:
            the extension is not made of digits only'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersStatusMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersStatusMessage'
      operationId: post_webrtc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersSoftwareDeviceRequest'
  /adminphone:
    get:
      summary: Return the state of the administrator phone.
      description: The administrator phone is a service PJSIP extension configured
        for WebRTC and not linked to any user. It lets the administrator place test
        calls from the administration UI. The response never contains the SIP secret.
      tags:
      - AdminPhone
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPhoneStatus'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
      operationId: get_adminphone
    delete:
      summary: Remove the administrator phone.
      description: Deletes the service extension and forgets its number. Idempotent.
        FreePBX is reloaded only when an extension was removed.
      tags:
      - AdminPhone
      responses:
        '204':
          description: No content
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
      operationId: delete_adminphone
  /adminphone/session:
    post:
      summary: Prepare the administrator phone and return its SIP credentials.
      description: 'Creates the service extension when missing (first free number
        from 770000 to 770099, then kept in the module kvstore), repairs its WebRTC
        settings and returns the credentials for the Phone Island in SIP only mode.
        No Userman user, CTI user or device row is created, so the extension is not
        listed among users or operators and does not count in the user limit. Calls
        use the accountcode `nv-admin`. FreePBX is reloaded in the background only
        when something changed: `reloading` is then true and registration may fail
        until the reload completes. The secret must be kept in memory only.'
      tags:
      - AdminPhone
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPhoneSessionRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPhoneSession'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
      operationId: post_adminphone_session
  /devices/gateways/download/{name}/{mac}:
    get:
      summary: Generate the configuration file of a gateway and return it Base64 encoded.
      tags:
      - Devices
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                description: Base64 encoded configuration file
        '500':
          description: Internal server error
      operationId: get_devices_gateways_download_name_mac
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: mac
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    FreePBXAuth:
      type: apiKey
      in: header
      name: User
      description: 'FreePBX authentication requires two headers:

        - `User`: FreePBX administrator username

        - `Secretkey`: SHA1 hash of (user + SHA1(password) + secret)'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    VideoSourceGate:
      type: object
      properties:
        id:
          type: integer
          description: Identifier of a stored gate (omit for a new one)
        position:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        type:
          type: string
          enum: [dtmf, url]
        code:
          type: string
          description: DTMF code sent to the source extension (dtmf gates)
          pattern: '^[0-9A-Da-d*#+]{1,30}$'
        url:
          type: string
          description: http(s) URL requested to open the gate (url gates)
        method:
          type: string
          enum: [GET, POST]
        username:
          type: string
        password:
          type: string
          writeOnly: true
        has_password:
          type: boolean
          readOnly: true
        tls_fingerprint:
          type: string
          nullable: true
          readOnly: true
          description: SHA-256 of the certificate of an https:// gate device,
            pinned when the source (with `tls_skip_verify`) is saved
    VideoSourceInput:
      type: object
      required:
      - descr
      - url
      properties:
        descr:
          type: string
          maxLength: 50
        url:
          type: string
          example: rtsp://192.0.2.10:554/stream1
        user:
          type: string
        secret:
          type: string
          writeOnly: true
        exten:
          type: string
        frame-rate:
          type: integer
          minimum: 500
          description: Polling interval of image sources, in milliseconds
        open:
          type: string
          description: Legacy opening code, used only when `gates` is absent
        gates:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/VideoSourceGate'
        tls_skip_verify:
          type: boolean
          default: false
          description: 'Skip the TLS certificate verification for the source
            URL and all its URL gates (devices with a self-signed
            certificate). Absent on update: the stored value is kept. Stored
            as false when neither the URL nor a URL gate uses TLS. The SHA-256
            fingerprint of the certificate each TLS device (rtsps:// or
            https:// URL, https:// URL gates) presents when the source is
            saved is pinned: the save fails (400) if a certificate cannot be
            read and none is stored for that device.'
        profiles:
          type: array
          items:
            type: string
        door_phone:
          type: string
          description: MAC of a door phone prepared by
            `POST /cti/streaming/doorphones/{mac}`, whose generated RTSP
            password is used when `secret` is empty and `user` is the door
            phone user name.
    VideoSource:
      type: object
      properties:
        descr:
          type: string
        type:
          type: string
          enum: [image, rtsp]
        url:
          type: string
          description: URL without credentials
        user:
          type: string
        has_secret:
          type: boolean
        frame-rate:
          type: string
        exten:
          type: string
          nullable: true
        open:
          type: string
          description: Code of the first DTMF gate (legacy)
        gates:
          type: array
          items:
            $ref: '#/components/schemas/VideoSourceGate'
        tls_skip_verify:
          type: boolean
        tls_fingerprint:
          type: string
          nullable: true
          readOnly: true
          description: SHA-256 of the device certificate pinned by the gateway
            (rtsps://) or by nethcti-server (https://) for sources with
            `tls_skip_verify`, null if none
        tls_unpinned:
          type: boolean
          readOnly: true
          description: 'A device of the source skips the TLS verification
            without a pinned certificate (saved by an older version): it is
            contacted unpinned until the source is saved again'
        permission:
          type: string
          example: vs_front_door
        gateway_path:
          type: string
          nullable: true
          example: streaming-gw/vs_front_door
        profiles:
          type: array
          items:
            type: string
    VideoSourceCheck:
      type: object
      properties:
        success:
          type: boolean
        type:
          type: string
          enum: [image, rtsp]
        image:
          type: string
          nullable: true
          description: Base64 preview
        mime:
          type: string
          nullable: true
        video:
          type: object
          nullable: true
          properties:
            codec:
              type: string
              example: h264
            width:
              type: integer
            height:
              type: integer
        audio:
          type: object
          nullable: true
          properties:
            codec:
              type: string
              example: pcm_mulaw
            sample_rate:
              type: integer
        h265:
          type: boolean
          description: The video is H.265, which most browsers cannot play
        warnings:
          type: array
          items:
            type: string
            enum: [h265, codec_not_supported_by_webrtc, preview_failed, tls_certificate_changed]
          description: '`tls_certificate_changed`: the device certificate is
            not the one pinned by the gateway, which refuses the device until
            the source is saved again'
        reason:
          type: string
          nullable: true
          enum: [auth_failed, connection_refused, timeout, not_found, tls_error, unsupported, address_not_allowed, unknown, null]
          description: '`address_not_allowed`: loopback, link-local or
            unspecified device address; `unsupported` also for an image
            source that does not answer with a JPEG or PNG image (its content
            is never returned)'
        message:
          type: string
          description: Raw error message, without credentials
        tls_fingerprint:
          type: string
          nullable: true
          description: SHA-256 of the certificate of a rtsps:// or https://
            device, read when `tls_skip_verify` is set
    VideoSourceError:
      type: object
      properties:
        status:
          type: string
        field:
          type: string
    LegacyError:
      type: object
      description: Error body returned by the legacy handlers.
      properties:
        error:
          type: string
    TestAuthRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TestAuthResponse:
      type: object
      required:
      - result
      properties:
        result:
          type: string
          description: Shared secret used to compute the Secretkey header.
    SuccessFlag:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
    AdminSection:
      type: string
      enum:
      - superadmin
      - dashboard
      - users
      - trunks
      - routes
      - phones
      - integrations
      - settings
    CurrentAdmin:
      type: object
      required:
      - username
      - permissions
      properties:
        username:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/AdminSection'
    WizardState:
      type: object
      required:
      - step
      - status
      properties:
        step:
          oneOf:
          - type: integer
          - type: string
          description: Wizard step reached. 13 is the final step.
        status:
          type: string
          nullable: true
          description: '"true" while the wizard is in progress, "false" once completed.'
    WizardStateRequest:
      type: object
      required:
      - step
      - status
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 13
          description: Saving step 13 with status false restarts Asterisk, nethcti-server
            and nethcti-middleware.
        status:
          type: string
          enum:
          - 'true'
          - 'false'
    PbxLanguages:
      type: object
      description: Installed PBX languages, keyed by language code.
      additionalProperties:
        type: object
        required:
        - default
        properties:
          default:
            type: boolean
    DefaultLanguageRequest:
      type: object
      required:
      - lang
      properties:
        lang:
          type: string
          description: Language code, as returned by GET /settings/languages.
    TrunkDetails:
      type: object
      description: Technology parameters of the trunk (`pjsip` table for PJSIP trunks).
        Every value is a string. Credentials (`secret`, `md5_cred` and every `auth_*`
        keyword) are never returned.
      properties:
        codecs:
          type: string
          description: Comma separated list of allowed codecs
          example: alaw,ulaw
        sip_server:
          type: string
        sip_server_port:
          type: string
        username:
          type: string
        registration:
          type: string
          example: send
        authentication:
          type: string
          example: outbound
      additionalProperties:
        type: string
        nullable: true
    Trunk:
      type: object
      required:
      - trunkid
      - tech
      - name
      properties:
        trunkid:
          type: integer
        tech:
          type: string
          example: pjsip
        channelid:
          type: string
        name:
          type: string
        outcid:
          type: string
          description: Phone number of the trunk (outbound caller ID)
        keepcid:
          type: string
        maxchans:
          type: string
        failscript:
          type: string
        dialoutprefix:
          type: string
        usercontext:
          type: string
        provider:
          type: string
          description: Provider identifier, as given to `POST /trunks`; empty for
            trunks created outside the wizard.
        disabled:
          type: string
          enum:
          - 'on'
          - 'off'
        continue:
          type: string
        routedisplay:
          type: string
        dialopts:
          oneOf:
          - type: boolean
          - type: string
        username:
          type: string
          nullable: true
        details:
          $ref: '#/components/schemas/TrunkDetails'
    TrunkCreateRequest:
      type: object
      required:
      - provider
      - username
      - password
      - phone
      - codecs
      - forceCodec
      properties:
        provider:
          type: string
          description: Provider identifier from `GET /providers`
          example: twt
        name:
          type: string
          maxLength: 50
          description: Trunk name. It becomes the PJSIP endpoint name. Defaults to
            the provider identifier.
          example: main_trunk
        username:
          type: string
        password:
          type: string
        phone:
          type: string
          example: '0721405516'
        codecs:
          type: array
          items:
            type: string
          description: Preferred codecs. An empty list keeps the provider defaults.
        forceCodec:
          type: boolean
          description: When true only `codecs` are allowed. When false they are merged
            with the provider defaults.
    TrunkUpdateRequest:
      type: object
      description: Only the fields that are present are changed.
      properties:
        username:
          type: string
        password:
          type: string
          description: New SIP secret. An empty or blank string keeps the current
            secret.
        phone:
          type: string
        codecs:
          type: array
          items:
            type: string
        forceCodec:
          type: boolean
    TrunkProvider:
      type: object
      required:
      - id
      - provider
      - description
      properties:
        id:
          type: integer
        provider:
          type: string
          example: twt
        description:
          type: string
          example: TWT
        codecs:
          type: string
          nullable: true
          description: Comma separated default codecs of the provider
          example: ulaw,alaw,g729
        sip_server:
          type: string
          nullable: true
          description: Default SIP server of the provider, used to recognize trunks created without a provider
          example: sip.example.com
    TrunkCodec:
      type: object
      required:
      - codec
      - enabled
      properties:
        codec:
          type: string
          example: alaw
        enabled:
          type: boolean
    GatewayModel:
      type: object
      required:
      - id
      - model
      - manufacturer
      - description
      properties:
        id:
          type: integer
        model:
          type: string
          example: TRI_ISDN_2
        manufacturer:
          type: string
          example: Patton
        tech:
          type: string
          example: isdn
        n_pri_trunks:
          type: integer
        n_isdn_trunks:
          type: integer
        n_fxo_trunks:
          type: integer
        n_fxs_ext:
          type: integer
        description:
          type: string
          example: TRINITY ISDN 2 Porte
        proxy:
          type: string
          example: sip:10.5.4.1:5060;lr
        ipv4_green:
          type: string
          description: Default PBX address (`NETHVOICE_HOST`)
          example: voice.example.org
    GatewayIsdnPort:
      type: object
      properties:
        name:
          type: integer
          description: 'On read: identifier of the trunk created for the port. On
            write: port number.'
        type:
          type: string
          enum:
          - pp
          - pmp
          description: Point-to-point or point-to-multipoint
    GatewayPriPort:
      type: object
      properties:
        name:
          type: integer
          description: Port number (write only)
        linked_trunk:
          type: integer
          description: Identifier of the trunk created for the port (read only)
    GatewayFxoPort:
      type: object
      properties:
        name:
          type: integer
          description: Port number (write only)
        number:
          type: string
          nullable: true
          description: Phone number of the analog line
        linked_trunk:
          type: integer
          description: Identifier of the trunk created for the port (read only)
    GatewayFxsPort:
      type: object
      properties:
        name:
          type: integer
          description: Port number (write only)
        linked_extension:
          type: string
          nullable: true
          description: Main extension of the user connected to the port
    GatewayConfig:
      type: object
      required:
      - id
      - model
      - mac
      properties:
        id:
          type: integer
        model_id:
          type: integer
        model:
          type: integer
          description: Same as `model_id`
        manufacturer:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        ipv4:
          type: string
          nullable: true
        ipv4_new:
          type: string
          nullable: true
          description: IP address of the device
        gateway:
          type: string
          nullable: true
        ipv4_green:
          type: string
          nullable: true
          description: PBX address
        netmask_green:
          type: string
          nullable: true
        mac:
          type: string
          nullable: true
          example: 00:A0:BA:0B:1C:DD
        proxy:
          type: string
          nullable: true
        isConfigured:
          type: boolean
        isConnected:
          type: boolean
          description: Always false today (no device scan)
        trunks_isdn:
          type: array
          items:
            $ref: '#/components/schemas/GatewayIsdnPort'
        trunks_pri:
          type: array
          items:
            $ref: '#/components/schemas/GatewayPriPort'
        trunks_fxo:
          type: array
          items:
            $ref: '#/components/schemas/GatewayFxoPort'
        trunks_fxs:
          type: array
          items:
            $ref: '#/components/schemas/GatewayFxsPort'
    GatewaySaveRequest:
      type: object
      required:
      - name
      - model
      - mac
      - ipv4_new
      - netmask_green
      - gateway
      - ipv4_green
      properties:
        name:
          type: string
          description: Configuration name. A name containing ` TLS ` enables SRTP
            on the FXS extensions.
          example: Patton-TRINITY ISDN 2 Porte
        model:
          type: integer
          description: Model identifier from `GET /devices/gateways/manufacturers`
        manufacturer:
          type: string
        mac:
          type: string
          example: 00:A0:BA:0B:1C:DD
        ipv4:
          type: string
        ipv4_new:
          type: string
          description: IP address of the device
          example: 192.168.1.20
        netmask_green:
          type: string
          example: 255.255.255.0
        gateway:
          type: string
          example: 192.168.1.1
        ipv4_green:
          type: string
          description: PBX address
        proxy:
          type: string
        trunks_isdn:
          type: array
          items:
            $ref: '#/components/schemas/GatewayIsdnPort'
        trunks_pri:
          type: array
          items:
            $ref: '#/components/schemas/GatewayPriPort'
        trunks_fxo:
          type: array
          items:
            $ref: '#/components/schemas/GatewayFxoPort'
        trunks_fxs:
          type: array
          items:
            $ref: '#/components/schemas/GatewayFxsPort'
    GatewaySaveResult:
      type: object
      required:
      - status
      properties:
        status:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        infos:
          type: array
          items:
            type: string
        id:
          type: integer
          description: Identifier of the saved configuration (only on success)
    GatewayPushRequest:
      type: object
      required:
      - name
      - mac
      properties:
        name:
          type: string
        mac:
          type: string
    GatewayActionResult:
      type: object
      properties:
        status:
          oneOf:
          - type: boolean
          - type: string
          description: '`true` on success, `false` or an error message on failure'
        error:
          type: string
    HostNetwork:
      type: object
      properties:
        network:
          type: string
          example: 192.168.5.0
        ip:
          type: string
          example: 192.168.5.14
        netmask:
          type: string
          example: 255.255.255.0
        gateway:
          type: string
          example: 192.168.5.1
    RoutesInboundDestination:
      type: object
      description: A FreePBX destination, as returned by Modules::getDestinations().
      required:
      - destination
      - description
      properties:
        destination:
          type: string
          description: Dialplan target, e.g. `ext-queues,401,1`.
        description:
          type: string
        category:
          type: string
        id:
          type: string
        module:
          type: string
        name:
          type: string
        edit_url:
          type: string
    RoutesInboundRoute:
      type: object
      description: A row of the FreePBX `incoming` table. Only the fields used by
        the UI are listed.
      required:
      - extension
      - cidnum
      additionalProperties: true
      properties:
        extension:
          type: string
          description: DID number of the route.
        cidnum:
          type: string
          description: Caller ID the route is restricted to, empty for any caller.
        description:
          type: string
          nullable: true
        destination:
          type: string
          nullable: true
          description: Key of the `destinations` map.
    RoutesInboundRoutesResponse:
      type: object
      required:
      - destinations
      - routes
      properties:
        destinations:
          description: Map keyed by dialplan target. An empty map is serialized as
            an empty array.
          oneOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/RoutesInboundDestination'
          - type: array
            maxItems: 0
            items: {}
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RoutesInboundRoute'
