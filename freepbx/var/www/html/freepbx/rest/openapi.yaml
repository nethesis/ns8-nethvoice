                voicemail: novm
                ringtimer: '0'
                noanswer: ''
                recording: ''
                outboundcid: ''
                sipname: ''
                noanswer_cid: ''
                busy_cid: ''
                chanunavail_cid: ''
                noanswer_dest: ''
                busy_dest: ''
                chanunavail_dest: ''
                mohclass: default
                id: '201'
                tech: pjsip
                dial: PJSIP/201
                devicetype: fixed
                user: '201'
                description: Sample User
                emergency_cid: ''
                hint_override: null
                cwtone: disabled
                recording_in_external: dontcare
                recording_out_external: dontcare
                recording_in_internal: dontcare
                recording_out_internal: dontcare
                recording_ondemand: disabled
