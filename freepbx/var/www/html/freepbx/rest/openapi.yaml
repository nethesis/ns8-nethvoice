              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '403': *id001
      description: Creating a mysql or mssql source requires the superadmin permission.
        For administrators who are not superadmin, a body that is not a JSON or form
        object, a `dbtype` that is not a string or a `mapping` destination that is
        not one of `GET /phonebook/fields` returns 400.
      operationId: post_phonebook_config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsPhonebookSourceInput'
  /phonebook/config[/{id}]:
    post:
      summary: Create or update a phonebook source definition.
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: If `id` is omitted a `custom_<n>` identifier is generated automatically.
      operationId: post_phonebook_config[_id]
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /phonebook/config/{id}:
    delete:
      summary: Delete an external phonebook source and the contacts imported from
        it.
      description: The uploaded CSV file of the source is removed when no other source
        uses it. Deleting a mysql or mssql source requires the superadmin permission.
        For administrators who are not superadmin, an `id` that does not match
        `^[A-Za-z0-9_-]+$` returns 400.
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '400': *id004
        '403': *id001
      operationId: delete_phonebook_config_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Replace an external phonebook source.
      description: When the URL changes, the previously uploaded CSV file is removed
        if no other source uses it. An empty or omitted `password` keeps the stored
        one, unless the type, the host, the port or the Infinity URL change, which
        requires the password again. Saving a mysql or mssql source, or replacing
        a stored one, requires the superadmin permission. For administrators who are
        not superadmin, an `id` that does not match `^[A-Za-z0-9_-]+$`, a body that
        is not a JSON or form object, a `dbtype` that is not a string or a `mapping`
        destination that is not one of `GET /phonebook/fields` returns 400.
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid request, invalid source URL, invalid mapping or missing
            password for a different server
          content: *id005
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '403': *id001
      operationId: post_phonebook_config_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsPhonebookSourceInput'
  /phonebook/test:
    post:
      summary: Read the first rows of a phonebook source without saving it.
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsPhonebookTestResult'
        '400':
          description: Invalid request or invalid source URL
          content: &id003
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '403': *id001
        '404':
          description: Phonebook source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
      operationId: post_phonebook_test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsPhonebookTestInput'
      description: Testing a mysql or mssql source requires the superadmin permission.
        CSV and Infinity URLs of administrators who are not superadmin must be public
        http or https addresses or uploaded files. With `id` and an empty `password`,
        the stored password of that source is used, only for the same server.
  /phonebook/syncnow/{id}:
    post:
      summary: Import a phonebook source now (synchronous).
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '400':
          description: Invalid source id
          content: *id005
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '403': *id001
      description: Importing a mysql or mssql source requires the superadmin permission.
      operationId: post_phonebook_syncnow_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
  /phonebook/uploadfile:
    post:
      summary: Upload a CSV file to be used as a phonebook source.
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsPhonebookUploadResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
      description: Returns the `file://` URI to reference in subsequent configuration
        calls.
      operationId: post_phonebook_uploadfile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
  /phonebook/ldap:
    get:
      summary: Return system LDAP phonebook connection details for clients.
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                ldaps:
                  enabled: true
                  port: '20014'
                  user: cn=ldapuser,dc=phonebook,dc=nh
                  password: UWaCaIHbpkWsuZpIUzWOVvkuO6G7FpWp
                  tls: ldaps
                  base: dc=phonebook,dc=nh
                  name_display: '%cn %o'
                  mainphone_number_attr: telephoneNumber
                  mobilephone_number_attr: mobile
                  otherphone_number_attr: homePhone
                  name_attr: cn o
                  number_filter: (|(telephoneNumber=%)(mobile=%)(homePhone=%))
                  name_filter: (|(cn=%)(o=%))
        '403': *id001
      description: Requires the phones section. The `password` of each entry is returned
        only to superadmin.
      operationId: get_phonebook_ldap
  /phonebook/sources:
    get:
      summary: Legacy endpoint reporting which built-in phonebook sources are enabled.
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                extensions: true
                nethcti: true
      operationId: get_phonebook_sources
  /phonebook/sources/{prop}/{status}:
    post:
      summary: Legacy toggle for built-in phonebook sources (no longer used).
      tags:
      - Phonebook
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      operationId: post_phonebook_sources_prop_status
      parameters:
      - name: prop
        in: path
        required: true
        schema:
          type: string
          enum:
          - speeddial
          - extensions
          - nethcti
      - name: status
        in: path
        required: true
        schema:
          type: string
          enum:
          - enabled
          - disabled
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /physicalextensions:
    get:
      summary: List all PJSIP (physical) extensions known to FreePBX.
      tags:
