              schema:
                $ref: '#/components/schemas/UsersMessage'
        '201':
          description: Extension assigned
        '403':
          description: Community version limited to 8 configured users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersStatusMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '422':
          description: Extension already in use
          content:
            application/json:
