        mobile:
          type: string
          description: Empty removes the number.
    UsersSoftwareDeviceRequest:
      type: object
      required:
      - extension
      properties:
        extension:
          type: string
          description: Main extension of the user.
    UsersMobileAppRequest:
      type: object
      required:
      - mainextension
      properties:
        mainextension:
          type: string
    UsersDeviceExtension:
      type: object
      required:
      - extension
      properties:
        extension:
          type: string
        mobile_extension:
          type: string
          nullable: true
    UsersBulkRequest:
      type: object
      description: Settings applied to all the main extensions of the path. Only the
        given keys are changed.
      properties:
        profile:
          type: integer
          description: Id of the CTI profile.
        displayname:
          type: string
        callwaiting:
          type: boolean
        ringtime:
          type: string
        callgroup: {}
        pickupgroup: {}
        noanswerdest:
          type: string
          nullable: true
        busydest:
          type: string
          nullable: true
        notreachabledest:
          type: string
          nullable: true
        outboundcid_fixed:
          type: string
          nullable: true
        outboundcid_variable: {}
    UsersBulkResult:
      type: object
      required:
      - status
      properties:
        status:
          type: boolean
        error:
          type: string
    PhonesPhysicalExtensionRequest:
      type: object
      description: Registers a phone in the inventory (no `mainextension`) or links
        it to a user creating its physical extension.
      required:
      - mac
      properties:
        mac:
          type: string
          description: MAC address, `-` or `:` separated.
        model:
          type: string
          nullable: true
          description: Tancredi model name.
        mainextension:
          type: string
          description: Main extension of the user the phone is assigned to. Leave
            it out to add the phone without a user.
        line:
          type: integer
          nullable: true
        web_user:
          type: string
        web_password:
          type: string
          description: Password of the phone web interface.
        clear_temporary:
          type: boolean
          description: Deletes the temporary physical extensions of the user first.
    PhonesPhysicalExtensionResponse:
      type: object
      required:
      - extension
      properties:
        extension:
          type: string
          description: Physical extension created for the phone.
    PhonesStatusError:
      type: object
      properties:
        status:
          type: string
    PhonesModelRequest:
      type: object
      required:
      - model
      properties:
        model:
          type: string
          nullable: true
          description: Tancredi model name. Empty clears it.
    PhonesAdminPasswordRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
    PhonesReconfigureRequest:
      type: object
      required:
      - extension
      properties:
        extension:
          type: string
          description: Physical extension of the phone to reload.
    PhonesErrorMessage:
      type: object
      properties:
        error:
          type: string
    PhonesRpsRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          description: Provisioning URL the phone must download its configuration
            from.
    SettingsAdminPasswordRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          description: New clear-text password. For `admin` it is stored as `ampusers.password_sha1`,
            which also changes the `Secretkey` the client must send from then on.
    SettingsPasswordError:
      type: object
      required:
      - result
      properties:
        result:
          type: string
  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
tags:
- name: Authentication
  description: Endpoints that bootstrap or tear down the FreePBX session used by the
    REST layer.
- name: Bulk
  description: Shared tooling for reading and applying batch configuration across
    multiple main extensions.
- name: Codecs
  description: Static list of codecs supported by the provisioning workflow.
- name: Configuration
  description: System-level configuration helpers for SIP, wizard state and auxiliary
    services.
- name: CTI
  description: 'Computer-telephony integration (CTI) configuration: permission profiles,
    groups, customer cards, streaming widgets and external data sources.'
- name: Devices
  description: Inventory and provisioning helpers for phones and gateways discovered
    by NethVoice.
- name: Mainextensions
  description: CRUD helpers for FreePBX virtual (main) extensions used as user anchors.
- name: Migration
  description: Automation used when importing configuration from legacy NethVoice
    / FreePBX installations.
- name: Mobiles
  description: Manage mobile phone numbers associated with PBX users.
- name: Nethlink
  description: Provision auxiliary extensions used by the NethLink integration.
- name: Phonebook
  description: APIs for managing external phonebook sources and LDAP exposure.
- name: Physicalextensions
  description: Provision and maintain PJSIP physical, mobile app and custom extensions
    tied to a main extension.
- name: Providers
  description: Catalog of SIP provider templates shipped with the REST layer.
- name: Provisioning V2
  description: Provisioning engine control endpoints (Tancredi and companion services).
- name: Routes
  description: Inbound and outbound routing management utilities.
- name: Settings
  description: FreePBX language and conferencing related helpers exposed via REST.
- name: Tasks
  description: Temporary task API stub kept for backward compatibility.
- name: Trunks
  description: Manage SIP trunks and their credentials.
- name: Users
  description: User provisioning helpers backed by the legacy FreePBX userman integration.
- name: Voicemails
  description: Enable or query voicemail mailboxes linked to extensions.
- name: Webrtc
  description: Manage WebRTC softphone extensions paired with main extensions.
