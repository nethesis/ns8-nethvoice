        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySaveResult'
        '409':
          description: Another gateway already uses this MAC address. Nothing is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySaveResult'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySaveResult'
      operationId: post_devices_gateways
      requestBody:
        required: true
        content:
