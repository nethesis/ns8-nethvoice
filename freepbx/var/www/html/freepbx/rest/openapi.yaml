  /devices/gateways:
    post:
      summary: Create or update a gateway configuration and related trunks.
      description: Trunks and FXS extensions are created first and the gateway
        configuration is written in one transaction at the end. When any step fails,
        the trunks and extensions created by the request are removed and an existing
        configuration with the same name and MAC address is kept. Cleanup failures
        are listed in `warnings`.
