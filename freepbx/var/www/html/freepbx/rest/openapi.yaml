        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhonesStatusError'
      operationId: patch_physicalextensions_mac
      parameters:
      - name: mac
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhonesModelRequest'
  /mobileapp:
    post:
