          example: 255.255.255.0
        gateway:
          type: string
          example: 192.168.5.1
    RoutesInboundDestination:
      type: object
      description: A FreePBX destination, as returned by Modules::getDestinations().
      required:
      - destination
      - description
      properties:
        destination:
          type: string
          description: Dialplan target, e.g. `ext-queues,401,1`.
        description:
          type: string
        category:
          type: string
        id:
          type: string
        module:
          type: string
        name:
          type: string
        edit_url:
          type: string
    RoutesInboundRoute:
      type: object
      description: A row of the FreePBX `incoming` table. Only the fields used by
        the UI are listed.
      required:
      - extension
      - cidnum
      additionalProperties: true
      properties:
        extension:
          type: string
          description: DID number of the route.
        cidnum:
          type: string
          description: Caller ID the route is restricted to, empty for any caller.
        description:
          type: string
          nullable: true
        destination:
          type: string
          nullable: true
          description: Key of the `destinations` map.
    RoutesInboundRoutesResponse:
      type: object
      required:
      - destinations
      - routes
      properties:
        destinations:
          description: Map keyed by dialplan target. An empty map is serialized as
            an empty array.
          oneOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/RoutesInboundDestination'
          - type: array
            maxItems: 0
            items: {}
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RoutesInboundRoute'
    RoutesInboundRouteDeleteRequest:
      type: object
      required:
      - extension
      properties:
        extension:
          type: string
        cid:
          type: string
          description: Caller ID of the route, empty for any caller.
    RoutesOutboundTrunk:
      type: object
      required:
      - trunkid
      properties:
        trunkid:
          type: integer
        name:
          type: string
          nullable: true
    RoutesOutboundRoute:
      type: object
      description: A FreePBX outbound route with its trunks in priority order. Only
        the fields used by the UI are listed.
      required:
      - route_id
      - name
      - trunks
      additionalProperties: true
      properties:
        route_id:
          type: integer
        name:
          type: string
          description: Default routes are named `<kind>_<locale>`, e.g. `national_it`.
        seq:
          type: integer
          description: Position of the route in the dialplan.
        trunks:
          type: array
          items:
            $ref: '#/components/schemas/RoutesOutboundTrunk'
    RoutesOutboundDefaultRoute:
      type: object
      required:
      - name
      - trunks
      properties:
        name:
          type: string
        trunks:
          type: array
          description: Every trunk of the PBX, except the DAHDI trunk created by FreePBX.
          items:
            $ref: '#/components/schemas/RoutesOutboundTrunk'
    RoutesOutboundDefaults:
      description: Default routes keyed by dial plan locale. An empty map is serialized
        as an empty array.
      oneOf:
      - type: object
        additionalProperties:
          type: array
          items:
            $ref: '#/components/schemas/RoutesOutboundDefaultRoute'
      - type: array
        maxItems: 0
        items: {}
    RoutesOutboundSaveRoute:
      type: object
      required:
      - name
      - trunks
      properties:
        route_id:
          type: integer
          description: Present on every route to update them, absent on every route
            to create the defaults.
        name:
          type: string
        trunks:
          type: array
          items:
            $ref: '#/components/schemas/RoutesOutboundTrunk'
    RoutesOutboundSaveRequest:
      type: object
      description: A single key, the dial plan locale, holding the list of routes.
        When the first route has no `route_id` the default routes of that locale are
        created with the given trunks. Otherwise every listed route gets its array
        index as position and its trunks replaced, so the list must contain all the
        routes in their current order.
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/RoutesOutboundSaveRoute'
