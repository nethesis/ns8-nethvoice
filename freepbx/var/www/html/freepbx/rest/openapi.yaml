openapi: 3.0.3
info:
  title: NethVoice FreePBX REST API
  version: 1.0.0
  description: 'Simple REST API framework for NethVoice based on Slim framework.


    ## Authentication

    Each request must include two HTTP headers:

    - `User`: must be a valid FreePBX administrator (ampusers table)

    - `Secretkey`: must be a valid hash calculated from user + password (SHA1) + shared
    secret


    Authentication endpoints (`/login`, `/logout`, `/testauth`) do not require these
    headers.

    Shared secrets is saved inside the `passwords.env` file, under the `NETHVOICESECRETKEY`
    variable. '
  contact:
    name: Nethesis
    url: https://www.nethesis.it
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: https://{host}/freepbx/rest
  description: NethVoice REST API server
  variables:
    host:
      default: voice.nethserver.org
      description: Your NethVoice server hostname or IP
security:
- FreePBXAuth: []
paths:
  /login:
    get:
      summary: Create a FreePBX admin session cookie.
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlag'
      description: 'Returns `{ "success": true }` after seeding the AMP session as
        the `admin` user.'
      operationId: get_login
      security: []
  /logout:
    get:
      summary: Invalidate the current FreePBX admin session.
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlag'
      description: 'Clears the `AMP_user` session entry and returns `{ "success":
        true }`.'
      operationId: get_logout
      security: []
  /testauth:
    post:
      summary: Validate FreePBX credentials and disclose the shared secret.
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAuthResponse'
        '401':
          description: Invalid credentials
      description: 'Body: `{ "username": "", "password": "" }`. On success returns
        `{ "result": "<secret>" }` with status 200; otherwise 401.'
      operationId: post_testauth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAuthRequest'
  /contexts:
    get:
      summary: List dialplan contexts available for assignment.
      tags:
      - Bulk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                from-internal: Standard
                cti-profile-3: CTI Profile Advanced
      description: Returns a JSON object keyed by context name with a human description.
      operationId: get_contexts
  /bulk/{mainextensions}:
    get:
      summary: Inspect common settings across a set of main extensions.
      tags:
      - Bulk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Segment expects a comma separated extension list. Returns only
        values that are identical across the group; divergent keys are `null`.
      operationId: get_bulk_mainextensions
      parameters:
      - name: mainextensions
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Apply the same settings to a comma separated list of main extensions.
      tags:
      - Bulk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersBulkResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersBulkResult'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersBulkResult'
      description: 'Body: JSON object with keys such as `displayname`, `callwaiting`,
        `outboundcid_*`, etc. Triggers `retrieveHelper.sh` on success.'
      operationId: post_bulk_mainextensions
      parameters:
      - name: mainextensions
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersBulkRequest'
  /destinations:
    get:
      summary: Enumerate FreePBX destinations for call routing.
      tags:
      - Bulk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                Announcements:
                  '99999':
                    destination: popover
                    description: Add new Announcements &#133
                    category: announcement
                    selected: false
                Callback:
                  '99999':
                    destination: popover
                    description: Add new Callback &#133
                    category: callback
                    selected: false
      description: Wraps the FreePBX destination helper and returns raw data for UI
        selection.
      operationId: get_destinations
  /codecs/voip:
    get:
      summary: Return the ordered list of VoIP trunk codecs.
      tags:
      - Codecs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrunkCodec'
      description: 'Currently returns alaw, ulaw and g729 with `enabled: true`.'
      operationId: get_codecs_voip
  /configuration/userprovider:
    get:
      summary: Report the configured directory provider.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                configured: 1
                type: ldap
      description: Derives the LDAP domain from `NETHVOICE_LDAP_BASE` and reports
        the provider as configured.
      operationId: get_configuration_userprovider
  /configuration/mode:
    get:
      summary: Indicate whether the system is in legacy or UC mode.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                result: unknown
      description: Evaluates the `LegacyMode` prop and presence of `nethserver-directory`
        to return `legacy`, `uc` or `unknown`.
      operationId: get_configuration_mode
  /configuration/networks:
    get:
      summary: Expose host local network metadata from the environment.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/HostNetwork'
      description: Returns the decoded `NETHVOICE_HOST_LOCAL_NETWORKS` value or an
        empty array.
      operationId: get_configuration_networks
  /configuration/wizard:
    get:
      summary: Read the installation wizard progress state.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  $ref: '#/components/schemas/WizardState'
        '500':
          description: Internal server error
      description: Returns the rows in `rest_wizard`, providing the last completed
        step and status.
      operationId: get_configuration_wizard
    post:
      summary: Persist the current wizard step and optionally trigger service restarts.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      description: 'Body: `{ "step": <int>, "status": <bool> }`. Step 13 restarts
        Asterisk and signals the CTI service.'
      operationId: post_configuration_wizard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardStateRequest'
  /configuration/externalip:
    get:
      summary: Return the SIP external IP configured in FreePBX.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: 127.0.0.1
      operationId: get_configuration_externalip
  /configuration/externalip/{ip}:
    post:
      summary: Update the SIP external IP and queue a dialplan reload.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Path parameter `ip` must be a valid IPv4 address. Invokes `retrieveHelper.sh`
        on success.
      operationId: post_configuration_externalip_ip
      parameters:
      - name: ip
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /configuration/suggestedip:
    get:
      summary: Discover the public IP as seen from ifconfig.io.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: 146.190.28.17
      description: Returns the IP string on success or HTTP 500 on lookup failure.
      operationId: get_configuration_suggestedip
  /configuration/allowexternalsips:
    get:
      summary: Legacy stub that always reports external SIP access as enabled.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: enabled
      description: Endpoint kept for backward compatibility; always returns the string
        `"enabled"`.
      operationId: get_configuration_allowexternalsips
  /configuration/allowexternalsips/{status}:
    post:
      summary: Legacy stub used by historical UIs to toggle external SIP access.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Currently a no-op that still returns HTTP 200. Accepts only `enabled`
        or `disabled` in the path.
      operationId: post_configuration_allowexternalsips_status
      parameters:
      - name: status
        in: path
        required: true
        schema:
          type: string
          enum:
          - enabled
          - disabled
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /configuration/localnetworks:
    get:
      summary: Retrieve the SIP local network list from FreePBX.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: false
      operationId: get_configuration_localnetworks
    post:
      summary: Request an Asterisk restart after out-of-band local network changes.
      tags:
      - Configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      description: Does not accept a body; it simply issues `core restart when convenient`
        through AMI.
      operationId: post_configuration_localnetworks
      requestBody:
        content:
          application/json:
            schema:
              type: object
  /cti/profiles:
    get:
      summary: List CTI permission profiles with macro permissions attached.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CtiProfile'
        '500':
          description: Internal server error
      operationId: get_cti_profiles
    post:
      summary: Create a new CTI profile.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiProfileCreated'
        '409':
          description: Another profile already has this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Empty name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
      description: Body mirrors the profile schema used by the UI. Response returns
        the generated profile id, or 409 when the name is already used.
      operationId: post_cti_profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiProfileRequest'
  /cti/profiles/{id}:
    get:
      summary: Retrieve a single CTI profile by identifier.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiProfile'
        '500':
          description: Internal server error
      operationId: get_cti_profiles_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Update an existing CTI profile definition.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another profile already has this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Empty name, or a rename from or to the reserved Hotel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Another profile update is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
      description: 'Body: serialized profile as produced by the UI; renames the profile,
        updates macro permissions and triggers a dialplan reload.'
      operationId: post_cti_profiles_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiProfileRequest'
    delete:
      summary: Delete a CTI profile and clean up related permissions.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '500':
          description: Internal server error
      operationId: delete_cti_profiles_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/permissions:
    get:
      summary: Enumerate all available CTI permissions grouped by macro category.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                settings:
                  value: false
                  permissions:
                  - id: '2'
                    name: dnd
                    displayname: DND
                    description: Configure do Not Disturb
                    value: false
                  - id: '3'
                    name: call_forward
                    displayname: Call Forward
                    description: Configure Call Forward
                    value: false
                  - id: '4'
                    name: recording
                    displayname: Recording
                    description: Record own conversations. View/listen/delete own
                      recording
                    value: false
                  - id: '5'
                    name: conference
                    displayname: Conference
                    description: Make a conference call
                    value: false
                  - id: '6'
                    name: parkings
                    displayname: Parkings
                    description: View parkings state and pickup parked calls
                    value: false
                  - id: '15'
                    name: spy
                    displayname: Spy
                    description: Hear other extensions calls
                    value: false
                  - id: '16'
                    name: intrude
                    displayname: Intrude
                    description: Intrude in calls
                    value: false
                  - id: '18'
                    name: pickup
                    displayname: Pickup
                    description: Pick-up any call
                    value: false
                phonebook:
                  value: false
                  permissions:
                  - id: '12'
                    name: ad_phonebook
                    displayname: Advanced Phonebook
                    description: Modify and delete all contacts
                    value: false
      operationId: get_cti_permissions
  /cti/profiles/users/{user_id}:
    get:
      summary: Return the CTI profile currently assigned to a given user id.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      operationId: get_cti_profiles_users_user_id
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Assign a CTI profile to a user.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '500':
          description: Internal server error
      description: 'Body: `{ "profile_id": <int> }`. Replaces any previous association.'
      operationId: post_cti_profiles_users_user_id
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiUserProfileRequest'
  /cti/groups:
    get:
      summary: List the CTI presence groups.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CtiGroup'
        '500':
          description: Internal server error
      operationId: get_cti_groups
    post:
      summary: Create a CTI presence group and its presence panel permission.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                description: Id of the group.
                oneOf:
                - type: integer
                - type: string
        '500':
          description: Internal server error
      description: 'Body: `{ "name": "<group name>" }`. Returns the created group
        id.'
      operationId: post_cti_groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiGroupCreateRequest'
  /cti/groups/users/{id}:
    get:
      summary: Return the ids of the groups of a user.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        '500':
          description: Internal server error
      operationId: get_cti_groups_users_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Replace the groups assigned to a user.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      description: 'Body: `{ "groups": [<ids>] }`. Existing links are cleared before
        inserting the new list.'
      operationId: post_cti_groups_users_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtiUserGroupsRequest'
  /cti/users/groups/{id}:
    get:
      summary: List the users of a CTI group.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CtiGroupMember'
        '500':
          description: Internal server error
      operationId: get_cti_users_groups_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/groups/{id}:
    delete:
      summary: Remove a CTI group and its dynamic permission artifacts.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtiStatusFlag'
        '500':
          description: Internal server error
      operationId: delete_cti_groups_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/dbconn:
    post:
      summary: Create a database connection.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      description: Body includes host, port, type, credentials and database name;
        credentials are stored for later use by customer cards.
      operationId: post_cti_dbconn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsDbConnectionInput'
    get:
      summary: List the database connections used by customer cards.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationsDbConnection'
        '500':
          description: Internal server error
      operationId: get_cti_dbconn
  /cti/paramurl/{id}:
    put:
      summary: Update the URL and the profiles of a parameterized URL.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusError'
        '500':
          description: Internal server error
      description: 'Body: `{ "url": "...", "profiles": [ids], "only_queues": <bool>
        }`. Synchronizes the profile list for the URL.'
      operationId: put_cti_paramurl_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsParamUrlInput'
  /cti/dbconn/{id}:
    put:
      summary: Update the given fields of a database connection.
      description: Reloads nethcti-server so the customer cards use the new parameters.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
      operationId: put_cti_dbconn_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsDbConnectionInput'
    delete:
      summary: Delete a database connection.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: boolean
        '500':
          description: Internal server error
      operationId: delete_cti_dbconn_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /cti/paramurl:
    post:
      summary: Bind a parameterized URL to CTI profiles (a profile can have one URL
        only).
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      operationId: post_cti_paramurl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsParamUrlInput'
  /cti/paramurl/delete:
    post:
      summary: Unbind a parameterized URL from the given profiles.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
      operationId: post_cti_paramurl_delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsParamUrlDeleteInput'
  /cti/dbconn/type:
    get:
      summary: List the supported database types.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsDbConnectionTypes'
        '500':
          description: Internal server error
      operationId: get_cti_dbconn_type
  /cti/customer_card/template:
    get:
      summary: List the customer card templates.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationsCardTemplate'
        '500':
          description: Internal server error
      operationId: get_cti_customer_card_template
    post:
      summary: Create a customer card template.
      tags:
      - CTI
      responses:
        '200':
          description: Successful response
        '500':
          description: Internal server error
