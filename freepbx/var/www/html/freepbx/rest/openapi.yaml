      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example: []
      operationId: get_mainextensions
    post:
      summary: Assign, change or remove the main extension of a user.
      tags:
      - Mainextensions
      responses:
        '200':
          description: Extension removed, no new extension given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '201':
          description: Extension assigned
        '400':
          description: For administrators who are not superadmin, the extension is
            not made of digits only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '403':
          description: Community version limited to 8 configured users. The community
            limit does not count the current extension of the user being changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersStatusMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '422':
          description: Extension already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
      description: 'Body: `{ "username": "", "extension": "", "outboundcid": "" }`.
        Enforces community license user limits and triggers a reload.'
      operationId: post_mainextensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersMainExtensionRequest'
  /mainextensions/{extension}:
    get:
      summary: Retrieve a single main extension by number.
      tags:
      - Mainextensions
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      operationId: get_mainextensions_extension
      parameters:
      - name: extension
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
  /mainextensions/{extension}/reassign:
    post:
      summary: Move a main extension and all of its devices to another user.
      tags:
      - Mainextensions
      responses:
        '200':
          description: Extension reassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainExtensionReassignResult'
        '400':
          description: Missing username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '404':
          description: Main extension or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '422':
          description: The user already has a main extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
      description: The extension numbers, the software devices, the physical phones
        with their credentials, the voicemail box and the group memberships move to
        the new user, who must not have a main extension. The previous owner keeps
        the account without an extension. The new user keeps its CTI profile, or gets
        the one of the previous owner when it has none. Display names and the voicemail
        owner are updated and a reload is triggered. Line and expansion keys of phones
        and custom models that point to the extension and whose label is the display
        name of the previous owner get the display name of the new user; phones load
        the new labels at their next provisioning.
      operationId: post_mainextensions_extension_reassign
      parameters:
      - name: extension
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainExtensionReassignRequest'
  /mainextensions/orphans:
    get:
      summary: List the main extensions of users removed from the account provider.
      tags:
      - Mainextensions
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MainExtensionOrphan'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
      operationId: get_mainextensions_orphans
      description: When the account provider removes a user, the main extension, the
        devices, the physical phones and the voicemail box are kept and the SIP credentials
        of every extension of the user are replaced, so the devices cannot register
        or call. A user created later with the same username gets everything back,
        with the original credentials, group memberships and CTI profile.
  /mainextensions/orphans/release:
    post:
      summary: Delete the extensions of removed users.
      tags:
      - Mainextensions
      responses:
        '204':
          description: Extensions deleted
        '400':
          description: Missing or invalid extensions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '404':
          description: An extension does not belong to a removed user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMessage'
      operationId: post_mainextensions_orphans_release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainExtensionOrphansReleaseRequest'
      description: Deletes the extensions, the software devices and the voicemail
        box of the chosen removed users and frees their physical phones. Nothing is
        changed when an extension does not belong to a removed user. A reload is triggered.
