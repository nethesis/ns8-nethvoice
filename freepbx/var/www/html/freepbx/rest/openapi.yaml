              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '502':
          description: The user domain answered with an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
        '503':
          description: The user domain is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersAccountError'
      operationId: patch_users_username_account
      description: Locking only prevents the sign-in with the account; extension,
        devices, voicemail, profile and groups do not change. A change of name or
        email synchronizes the users before answering.
      parameters:
      - name: username
        in: path
