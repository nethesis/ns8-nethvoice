  /dashboard/calls:
    get:
      summary: Summarize the calls of today for the dashboard.
      description: Reads the CDR from midnight of the PBX time zone. The legs of a
        call are counted once, feature codes and the calls of the administrator phone
        are not counted. A call is answered when a leg is ANSWERED, missed when a
        leg is NO ANSWER or BUSY, invalid otherwise (FAILED or CONGESTION). With
        range, the response also has the calls per hour of the period, counted
        from the CDR with the same rules; a call belongs to the hour of its first
        leg. The calls
        per hour are cached for 5 minutes per range; completed hours are kept
        and only the six hours before the hour of the previous read and the
        following ones are read again.
        Once a day the whole period is counted again.
        Requires the dashboard section.
      tags:
      - Dashboard
      parameters:
      - name: range
        in: query
        required: false
        description: Period of the calls per hour. Without it the response has only
          the calls of today.
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 15d
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - answered
                - missed
                - invalid
                - calls_by_hour
                properties:
                  total:
                    type: integer
                    minimum: 0
                  answered:
                    type: integer
                    minimum: 0
                  missed:
                    type: integer
                    minimum: 0
                  invalid:
                    type: integer
                    minimum: 0
                  calls_by_hour:
                    type: array
                    description: Calls started in each hour of today, from hour 0
                      to the current hour.
                    items:
                      type: integer
                      minimum: 0
                  range:
                    type: string
                    description: The requested range, only with range.
                    enum:
                    - 24h
                    - 7d
                    - 15d
                  source:
                    type: string
                    description: Where the calls per hour come from, only with range.
                    example: cdr
                  history_start:
                    type: integer
                    nullable: true
                    description: Unix time of the oldest CDR row, only with range.
                      Later than the time of the first point when the CDR does not
                      cover the whole range; null when the CDR is empty.
                  series:
                    type: array
                    description: Calls per hour of the range, only with range. One
                      point per hour of the PBX time zone, oldest first, the last
                      one is the current hour (24, 168 or 360 points).
                    items:
                      type: object
                      required:
                      - time
                      - calls
                      properties:
                        time:
                          type: integer
                          description: Unix time of the start of the hour.
                        calls:
                          type: integer
                          nullable: true
                          minimum: 0
                          description: Calls started in the hour, 0 without calls;
                            null when the hour ended before history_start.
              example:
                total: 12
                answered: 9
                missed: 2
                invalid: 1
                calls_by_hour:
                - 0
                - 0
                - 0
                - 0
                - 0
                - 0
                - 0
                - 0
                - 1
                - 3
                - 2
        '400':
          description: Invalid range
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Missing dashboard permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: string
      operationId: get_dashboard_calls
  /dashboard/phones:
    get:
      summary: Count the physical phones by provisioning status for the dashboard.
      description: Counts the phones of the Tancredi inventory. A phone is unassigned
        when no extension is assigned to its MAC address, pending when its first-access
        provisioning token still exists, provisioned when it has downloaded its configuration
        and one of its extensions is registered, failed when it has downloaded its
        configuration but none of its extensions is registered. A phone whose details
        Tancredi does not return is unknown. The result is cached for 30 seconds.
        Requires the dashboard section.
      tags:
      - Dashboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - provisioned
                - pending
                - unassigned
                - failed
                - unknown
                - total
                properties:
                  provisioned:
                    type: integer
                    minimum: 0
                  pending:
                    type: integer
                    minimum: 0
                  unassigned:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                  unknown:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 0
                    description: All the phones of the Tancredi inventory.
              example:
                provisioned: 116
                pending: 4
                unassigned: 2
                failed: 2
                unknown: 0
                total: 124
        '403':
          description: Missing dashboard permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Tancredi cannot be reached or another error occurred
          content:
            application/json:
              schema:
                type: string
      operationId: get_dashboard_phones
  /dashboard/system:
    get:
      summary: Return the release and the host status for the dashboard.
      description: The release is the tag of the NethVoice module image. Uptime, load
        average and memory usage come from the proc file system of the host. Requires
        the dashboard section.
      tags:
      - Dashboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - release
                - uptime_seconds
                - load_average
                - memory_used_percent
                properties:
                  release:
                    type: string
                    nullable: true
                    description: Tag of the module image, null when it is not known.
                  uptime_seconds:
                    type: integer
                    minimum: 0
                    description: Seconds since the host started.
                  load_average:
                    type: number
                    minimum: 0
                    description: Load average of the host in the last minute.
                  memory_used_percent:
                    type: number
                    minimum: 0
                    maximum: 100
                    description: Memory of the host in use, excluding the memory available
                      for new processes.
              example:
                release: 1.9.0
                uptime_seconds: 1231932
                load_average: 0.42
                memory_used_percent: 38
        '403':
          description: Missing dashboard permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: string
      operationId: get_dashboard_system
