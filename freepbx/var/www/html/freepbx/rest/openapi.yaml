          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
      operationId: patch_trunks_trunkid
      parameters:
      - name: trunkid
        in: path
