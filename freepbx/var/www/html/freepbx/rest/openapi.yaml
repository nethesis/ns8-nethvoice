          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayActionResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayActionResult'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayActionResult'
      description: Body requires at least `name` and `mac`. Launches `/lib/tftpPushConfig.php`.
      operationId: post_devices_gateways_push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayPushRequest'
