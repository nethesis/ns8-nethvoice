#
# The NethVoice, CTI and proxy names must resolve on the resolver of the
# node, and the proxy name must point to the proxy public or private IP. One
# alert, the reason label tells which check failed. Series come from
# export-metrics (pypkg/nvmetrics/dnscheck.py) every 5 minutes, so "for: 15m"
# means 3 failed checks in a row.
groups:
  - name: dns
    rules:
      - alert: NethVoiceDnsFailure
        expr: nethvoice_dns_resolves == 0
        for: 15m
        labels:
          severity: warning
          alertgroup: dns
          reason: not_resolved
        annotations:
          summary_en: "{{ $labels.name }} does not resolve"
          summary_it: "{{ $labels.name }} non è risolto"
          description_en: "The DNS resolver of the node does not resolve {{ $labels.name }} ({{ $labels.role }} of {{ $labels.module_id }}): NethVoice and its clients may not reach it. Check the DNS records and the resolver configuration."
          description_it: "Il resolver DNS del nodo non risolve {{ $labels.name }} ({{ $labels.role }} di {{ $labels.module_id }}): NethVoice e i suoi client potrebbero non raggiungerlo. Verificare i record DNS e la configurazione del resolver."
      - alert: NethVoiceDnsFailure
        expr: nethvoice_dns_proxy_ip_match == 0
        for: 15m
        labels:
          severity: warning
          alertgroup: dns
          reason: ip_mismatch
        annotations:
          summary_en: "{{ $labels.name }} does not point to the proxy IP"
          summary_it: "{{ $labels.name }} non punta all'IP del proxy"
          description_en: "The DNS resolver of the node resolves {{ $labels.name }} to {{ $labels.records }}, but the proxy IP is {{ $labels.expected }}. Phones and providers may reach the wrong address. Update the DNS record."
          description_it: "Il resolver DNS del nodo risolve {{ $labels.name }} in {{ $labels.records }}, ma l'IP del proxy è {{ $labels.expected }}. Telefoni e provider potrebbero raggiungere l'indirizzo sbagliato. Aggiornare il record DNS."
